rules:
- id: cwe570-condition-on-constant-static
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: $V is a file-local static that is initialized to $K and never modified, so this condition is always false.
  metadata:
    vulnerability_class: Expression is Always False
    help: |
      ## Summary
      `$V` is a file-local static that is initialized to `$K` and never modified, so this condition is always false.

      ## Remediation
      Fix conditions that are always false; they indicate a logic error or dead code.
    category: correctness
    cwe:
    - 'CWE-570: Expression is Always False'
    references:
    - https://cwe.mitre.org/data/definitions/570.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Fix conditions that are always false; they indicate a logic error or dead code.
  patterns:
  - pattern-not-inside: |
      $R $FN(...) {
        ...
        $V = $X;
        ...
      }
  - metavariable-regex:
      metavariable: $K
      regex: ^-?[0-9]+$
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern-inside: |
            static $T $V = $K;
            ...
        - pattern-inside: |
            static const $T $V = $K;
            ...
      - pattern: if ($V) $S;
      - metavariable-comparison:
          comparison: $K == 0
    - patterns:
      - pattern-either:
        - pattern-inside: |
            static $T $V = $K;
            ...
        - pattern-inside: |
            static const $T $V = $K;
            ...
      - pattern: if ($V == $L) $S;
      - metavariable-comparison:
          comparison: not ($K == $L)
    - patterns:
      - pattern-either:
        - pattern-inside: |
            static $T $V = $K;
            ...
        - pattern-inside: |
            static const $T $V = $K;
            ...
      - pattern: if ($V != $L) $S;
      - metavariable-comparison:
          comparison: not ($K != $L)
    - patterns:
      - pattern-either:
        - pattern-inside: |
            static $T $V = $K;
            ...
        - pattern-inside: |
            static const $T $V = $K;
            ...
      - pattern: if ($V < $L) $S;
      - metavariable-comparison:
          comparison: not ($K < $L)
    - patterns:
      - pattern-either:
        - pattern-inside: |
            static $T $V = $K;
            ...
        - pattern-inside: |
            static const $T $V = $K;
            ...
      - pattern: if ($V <= $L) $S;
      - metavariable-comparison:
          comparison: not ($K <= $L)
    - patterns:
      - pattern-either:
        - pattern-inside: |
            static $T $V = $K;
            ...
        - pattern-inside: |
            static const $T $V = $K;
            ...
      - pattern: if ($V > $L) $S;
      - metavariable-comparison:
          comparison: not ($K > $L)
    - patterns:
      - pattern-either:
        - pattern-inside: |
            static $T $V = $K;
            ...
        - pattern-inside: |
            static const $T $V = $K;
            ...
      - pattern: if ($V >= $L) $S;
      - metavariable-comparison:
          comparison: not ($K >= $L)
  - focus-metavariable: $V
