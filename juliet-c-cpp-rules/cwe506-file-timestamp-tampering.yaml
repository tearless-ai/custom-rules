rules:
- id: cwe506-file-timestamp-tampering
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: A file's timestamps are rewritten, a common anti-forensics technique used by embedded malicious code.
  metadata:
    vulnerability_class: Embedded Malicious Code
    help: |
      ## Summary
      A file's timestamps are rewritten, a common anti-forensics technique used by embedded malicious code.

      ## Remediation
      Remove hidden functionality that deletes, modifies or exfiltrates data or executes encoded commands.
    category: security
    cwe:
    - 'CWE-506: Embedded Malicious Code'
    references:
    - https://cwe.mitre.org/data/definitions/506.html
    confidence: LOW
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Remove hidden functionality that deletes, modifies or exfiltrates data or executes encoded commands.
    policy_name: 'Embedded Malicious Code: File Timestamp Tampering'
  patterns:
  - pattern: $F(...)
  - metavariable-regex:
      metavariable: $F
      regex: ^(SetFileTime|NtSetInformationFile|utime|utimes|_utime|_wutime|futimes|utimensat)$
  - focus-metavariable: $F
