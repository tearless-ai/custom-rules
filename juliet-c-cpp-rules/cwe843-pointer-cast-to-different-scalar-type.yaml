rules:
- id: cwe843-pointer-cast-to-different-scalar-type
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A pointer that refers to an object of one primitive type is cast to a pointer to a different
    primitive type and dereferenced, accessing the object with an incompatible type.
  metadata:
    vulnerability_class: Access of Resource Using Incompatible Type ('Type Confusion')
    help: |
      ## Summary
      A pointer that refers to an object of one primitive type is cast to a pointer to a different primitive type and dereferenced, accessing the object with an incompatible type.

      ## Remediation
      Access memory only through the type it was created with; do not reinterpret objects via incompatible pointer casts.
    category: security
    cwe:
    - 'CWE-843: Access of Resource Using Incompatible Type (''Type Confusion'')'
    references:
    - https://cwe.mitre.org/data/definitions/843.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Access memory only through the type it was created with; do not reinterpret objects via
      incompatible pointer casts.
  mode: taint
  options:
    taint_unify_mvars: true
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $RT $F(...) { ... $XT $X = $XI; ... }
      - pattern-inside: |
          $RT $F(...) { ... $XT $X; ... }
    - pattern-either:
      - pattern: '&$X'
      - patterns:
        - pattern-inside: |
            $RT $F(...) { ... $P = &$X; ... }
        - pattern-either:
          - pattern: $P
          - patterns:
            - pattern-inside: |
                $RT $F(...) { ... *$Q1 = $P; ... }
            - pattern-inside: |
                $RT $F(...) { ... $T1 $Q1 = &$V; ... }
            - pattern-inside: |
                $RT $F(...) { ... $T2 $Q2 = &$V; ... }
            - pattern: '*$Q2'
  pattern-propagators:
  - pattern: $U.$FLD = $W
    from: $W
    to: $U
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $RT $F(...) { ... $XT $X = $XI; ... }
      - pattern-inside: |
          $RT $F(...) { ... $XT $X; ... }
    - metavariable-regex:
        metavariable: $XT
        regex: ^((unsigned|signed)\s+)?(char|short|int|long|long\s+long|float|double|wchar_t|bool|size_t|u?int(8|16|32|64)_t)$
    - pattern-either:
      - pattern: ($T *) $D
      - pattern: reinterpret_cast<$T *>($D)
      - pattern: static_cast<$T *>($D)
    - metavariable-regex:
        metavariable: $T
        regex: ^((unsigned|signed)\s+)?(char|short|int|long|long\s+long|float|double|wchar_t|bool|size_t|u?int(8|16|32|64)_t)$
    - metavariable-comparison:
        comparison: str($T) != str($XT)
    - focus-metavariable: $D
