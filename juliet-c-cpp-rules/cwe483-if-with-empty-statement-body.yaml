rules:
- id: cwe483-if-with-empty-statement-body
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A stray semicolon right after the if condition makes the if body empty, so the following block
    always executes.
  metadata:
    vulnerability_class: Incorrect Block Delimitation
    help: |
      ## Summary
      A stray semicolon right after the if condition makes the if body empty, so the following block always executes.

      ## Remediation
      Always use braces for multi-statement if/else/loop bodies.
    category: correctness
    cwe:
    - 'CWE-483: Incorrect Block Delimitation'
    references:
    - https://cwe.mitre.org/data/definitions/483.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Always use braces for multi-statement if/else/loop bodies.
  pattern-regex: (?m)^[ \t]*(?:else[ \t]+)?(?:if|while|for)[ \t]*\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)[
    \t]*;
