rules:
- id: cwe483-unbraced-if-misleading-indentation
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: The statement after this unbraced if body is indented as if it belonged to the if, but it always executes.
  metadata:
    vulnerability_class: Incorrect Block Delimitation
    help: |
      ## Summary
      The statement after this unbraced if body is indented as if it belonged to the if, but it always executes.

      ## Remediation
      Always use braces for multi-statement if/else/loop bodies.
    category: correctness
    cwe:
    - 'CWE-483: Incorrect Block Delimitation'
    references:
    - https://cwe.mitre.org/data/definitions/483.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Always use braces for multi-statement if/else/loop bodies.
    policy_name: 'Incorrect Block Delimitation: Misleading Indentation'
  pattern-regex: (?m)^([ \t]*)(?:if|while|for)[ \t]*\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)[ \t]*\r?\n\1([ \t]+)[^\s{}/][^\n]*;[ \t]*\r?\n\1\2(?!else\b)[^\s{}/]
