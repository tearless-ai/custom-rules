rules:
- id: cwe591-secret-in-unlocked-heap-buffer
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: INFO
  message: A secret is written into a heap buffer that was not locked with VirtualLock() or mlock(), so it may be paged out to disk.
  metadata:
    vulnerability_class: Sensitive Data Storage in Improperly Locked Memory
    help: |
      ## Summary
      A secret is written into a heap buffer that was not locked with VirtualLock() or mlock(), so it may be paged out to disk.

      ## Remediation
      Lock memory that holds sensitive data (VirtualLock/mlock) so it is not swapped to disk, and check the result.
    category: security
    cwe:
    - 'CWE-591: Sensitive Data Storage in Improperly Locked Memory'
    references:
    - https://cwe.mitre.org/data/definitions/591.html
    confidence: LOW
    likelihood: MEDIUM
    impact: LOW
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Lock memory that holds sensitive data (VirtualLock/mlock) so it is not swapped to disk, and check the result.
    policy_name: Sensitive Data in Unlocked Heap Memory
  patterns:
  - pattern-either:
    - pattern: $CPY($P, ...)
  - metavariable-regex:
      metavariable: $CPY
      regex: ^(strcpy|wcscpy|_tcscpy|strncpy|wcsncpy|memcpy|lstrcpyA|lstrcpyW|StringCchCopyA|StringCchCopyW|strcpy_s|wcscpy_s|fgets|fgetws)$
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^.*(passw|passwd|pwd|passphrase|secret|privkey|private_key|credential)
  - pattern-either:
    - pattern-inside: |
        $P = ($T) $ALLOC(...);
        ...
    - pattern-inside: |
        $P = $ALLOC(...);
        ...
    - pattern-inside: |
        $T $P = ($T2) $ALLOC(...);
        ...
    - pattern-inside: |
        $T $P = $ALLOC(...);
        ...
    - pattern-inside: |
        $P = new $T[$N];
        ...
  - metavariable-regex:
      metavariable: $ALLOC
      regex: ^(malloc|calloc|realloc|HeapAlloc|LocalAlloc|GlobalAlloc|VirtualAlloc)$
  - pattern-not-inside: |
      VirtualLock($P, ...);
      ...
  - pattern-not-inside: |
      if (<... VirtualLock($P, ...) ...>) { ... }
      ...
  - pattern-not-inside: |
      if (<... VirtualLock($P, ...) ...>) { ... } else { ... }
      ...
  - pattern-not-inside: |
      mlock($P, ...);
      ...
  - pattern-not-inside: |
      if (<... mlock($P, ...) ...>) { ... }
      ...
  - pattern-not-inside: |
      if (<... mlock($P, ...) ...>) { ... } else { ... }
      ...
  - pattern-not-inside: |
      SecureZeroMemory($P, ...);
      ...
  - pattern-not-inside: |
      RtlSecureZeroMemory($P, ...);
      ...
  - pattern-not-inside: |
      memset($P, ...);
      ...
  - pattern-not-inside: |
      ZeroMemory($P, ...);
      ...
  - pattern-not-inside: |
      explicit_bzero($P, ...);
      ...
  - pattern-not-inside: |
      memset_s($P, ...);
      ...
  - pattern-not-inside: |
      $P = realloc($P, ...);
      ...
