rules:
- id: cwe253-eof-function-compared-zero
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: This I/O or formatting function signals failure with EOF/WEOF or a negative value, not 0, so comparing its result with 0 does not detect errors.
  metadata:
    vulnerability_class: Incorrect Check of Function Return Value
    help: |
      ## Summary
      This I/O or formatting function signals failure with EOF/WEOF or a negative value, not 0, so comparing its result with 0 does not detect errors.

      ## Remediation
      Compare return values against the function's documented error value (e.g. EOF, NULL, INVALID_HANDLE_VALUE, -1) rather than an assumed one.
    category: security
    cwe:
    - 'CWE-253: Incorrect Check of Function Return Value'
    references:
    - https://cwe.mitre.org/data/definitions/253.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Compare return values against the function's documented error value (e.g. EOF, NULL, INVALID_HANDLE_VALUE, -1) rather than an assumed one.
    policy_name: 'Incorrect Return Check: EOF-Returning Call Compared to Zero'
  patterns:
  - pattern-either:
    - pattern: $F(...) == 0
    - pattern: $F(...) != 0
    - pattern: 0 == $F(...)
  - metavariable-regex:
      metavariable: $F
      regex: ^(fputc|fputwc|fputs|fputws|putc|putwc|putchar|putwchar|puts|_putws|PUTS|fprintf|fwprintf|printf|wprintf|snprintf|_snprintf|_snwprintf|swprintf|SNPRINTF|fscanf|fwscanf|scanf|wscanf|sscanf|swscanf)$
