rules:
- id: cwe122-constant-index-variable-past-end-of-heap-array
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A write into a heap array uses an index variable that was assigned a constant not smaller than the array size, with no upper-bound check.
  metadata:
    vulnerability_class: Heap-based Buffer Overflow
    help: |
      ## Summary
      A write into a heap array uses an index variable that was assigned a constant not smaller than the array size, with no upper-bound check.

      ## Remediation
      Allocate enough room for the data including the terminator, bound every copy and index by the allocation size, and validate lengths and indexes from input before use.
    category: security
    cwe:
    - 'CWE-122: Heap-based Buffer Overflow'
    references:
    - https://cwe.mitre.org/data/definitions/122.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Allocate enough room for the data including the terminator, bound every copy and index by the allocation size, and validate lengths and indexes from input before use.
    policy_name: 'Heap Buffer Overflow: Index Variable Set Past Array End'
  options:
    constant_propagation: false
  patterns:
  - pattern: $BUF[$IDX] = $VAL;
  - pattern-either:
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $BUF = ($T2 *)malloc($N * sizeof(...));
          ...
        }
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $BUF = ($T2 *)calloc($N, sizeof(...));
          ...
        }
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $BUF = ($T2 *)realloc($OLD, $N * sizeof(...));
          ...
        }
    - pattern-either:
      - pattern-inside: |-
          $RET $F(...) {
            ...
            $BUF = new $T[$N];
            ...
          }
      - pattern-inside: |-
          $RET $F(...) {
            ...
            $BUF = new $T[$N] = $INIT;
            ...
          }
  - pattern-not-inside: if (<... $IDX < $MAX ...>) { ... }
  - pattern-not-inside: if (<... $IDX <= $MAX ...>) { ... }
  - pattern-not-inside: if (<... $MAX > $IDX ...>) { ... }
  - pattern-not-inside: if (<... $MAX >= $IDX ...>) { ... }
  - pattern-either:
    - patterns:
      - pattern-inside: |-
          $RET $F(...) {
            ...
            $V = $K;
            ...
          }
      - metavariable-regex:
          metavariable: $K
          regex: ^\d+$
    - patterns:
      - patterns:
        - pattern-inside: |-
            $CR1 $SINK($PT $V) {
              ...
            }
            ...
            $CR2 $CALLER(...) {
              ...
              $A = $K;
              ...
              $SINK($A);
              ...
            }
        - metavariable-regex:
            metavariable: $K
            regex: ^\d+$
      - pattern-inside: |-
          $CR1 $SINK($PT $V) {
            ...
          }
    - patterns:
      - patterns:
        - pattern-inside: |-
            $CR1 $SINK($PT $V) {
              ...
            }
            ...
            $CR2 $CALLER(...) {
              ...
              $FT (*$FPTR)(...) = $SINK;
              ...
              $A = $K;
              ...
              $FPTR($A);
              ...
            }
        - metavariable-regex:
            metavariable: $K
            regex: ^\d+$
      - pattern-inside: |-
          $CR1 $SINK($PT $V) {
            ...
          }
    - patterns:
      - patterns:
        - pattern-inside: |-
            $CR1 $SINK() {
              ...
              $PT $V = $GV;
              ...
            }
            ...
            $CR2 $CALLER(...) {
              ...
              $A = $K;
              ...
              $GV = $A;
              ...
              $SINK();
              ...
            }
        - metavariable-regex:
            metavariable: $K
            regex: ^\d+$
      - pattern-inside: |-
          $CR1 $SINK() {
            ...
          }
    - patterns:
      - patterns:
        - pattern-inside: |-
            $CR1 $SRCF(...) {
              ...
              $X = $K;
              ...
              return $X;
              ...
            }
            ...
            $CR2 $USEF(...) {
              ...
              $V = $SRCF(...);
              ...
            }
        - metavariable-regex:
            metavariable: $K
            regex: ^\d+$
      - pattern-inside: |-
          $CR2 $USEF(...) {
            ...
          }
    - patterns:
      - patterns:
        - pattern-inside: |-
            $CR1 $SRCF($PT &$X) {
              ...
              $X = $K;
              ...
            }
            ...
            $CR2 $USEF(...) {
              ...
              $SRCF($V);
              ...
            }
        - metavariable-regex:
            metavariable: $K
            regex: ^\d+$
      - pattern-inside: |-
          $CR2 $USEF(...) {
            ...
          }
    - patterns:
      - patterns:
        - pattern-inside: |-
            $CR1 $SETF(...) {
              ...
              $V = $K;
              ...
            }
            ...
            $CR2 $USEF(...) {
              ...
            }
        - metavariable-regex:
            metavariable: $K
            regex: ^\d+$
      - pattern-inside: |-
          $CR2 $USEF(...) {
            ...
          }
      - pattern-not-inside: |-
          $CX $USEF(...) {
            ...
            $TT $V;
            ...
          }
      - pattern-not-inside: |-
          $CX $SETF(...) {
            ...
            $TT $V;
            ...
          }
          ...
          $CY $USEF(...) {
            ...
          }
      - pattern-not-inside: |-
          $CX $USEF(...) {
            ...
            $TT $V = $IV;
            ...
          }
      - pattern-not-inside: |-
          $CX $SETF(...) {
            ...
            $TT $V = $IV;
            ...
          }
          ...
          $CY $USEF(...) {
            ...
          }
      - pattern-not-inside: |-
          $CX $USEF(..., $TT $V, ...) {
            ...
          }
      - pattern-not-inside: |-
          $CX $SETF(..., $TT $V, ...) {
            ...
          }
          ...
          $CY $USEF(...) {
            ...
          }
  - metavariable-comparison:
      comparison: str($V) == str($IDX) and $K >= $N
