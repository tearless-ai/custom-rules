rules:
- id: cwe15-system-setting-from-input-via-constructor
  languages:
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A system setting such as the computer name is changed to a value in a destructor, on member data whose constructor reads untrusted input from the console, a file, a socket or the environment, so that input controls the machine configuration.
  metadata:
    vulnerability_class: External Control of System or Configuration Setting
    help: |
      ## Summary
      A system setting such as the computer name is changed to a value in a destructor, on member data whose constructor reads untrusted input from the console, a file, a socket or the environment, so that input controls the machine configuration.

      ## Remediation
      Do not let external input choose system or configuration settings such as the host name or computer name; use fixed, validated values.
    category: security
    cwe:
    - 'CWE-15: External Control of System or Configuration Setting'
    references:
    - https://cwe.mitre.org/data/definitions/15.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Do not let external input choose system or configuration settings such as the host name or computer name; use fixed, validated values.
    policy_name: System Setting from Untrusted Input (Constructor to Destructor)
  patterns:
  - pattern: $SETFN($VALUE, ...)
  - metavariable-regex:
      metavariable: $SETFN
      regex: ^(SetComputerName|SetComputerNameA|SetComputerNameW|SetComputerNameEx|SetComputerNameExA|SetComputerNameExW|sethostname|setdomainname|SetSystemTime|SetLocalTime|settimeofday|stime)$
  - metavariable-regex:
      metavariable: $VALUE
      regex: ^(?!\s*(L|u8|u|U)?\")(?!\s*[A-Z][A-Z0-9_]*\s*$)
  - pattern-inside: |
      $T_D $DTOR(...) { ... }
  - metavariable-regex:
      metavariable: $DTOR
      regex: ^(?:\w+::)*(\w+)::~\1$
  - pattern-inside: |
      $T_CTOR $CTOR(...) {
        ...
        <... $SRC(...) ...>;
        ...
      }
      ...
  - metavariable-regex:
      metavariable: $CTOR
      regex: ^(?:\w+::)*(\w+)::\1$
  - metavariable-regex:
      metavariable: $SRC
      regex: ^(?:std::)?(fgets|fgetws|gets|_getws|getline|getdelim|scanf|wscanf|fscanf|fwscanf|read|_read|recv|recvfrom|recvmsg|WSARecv|WSARecvFrom|getenv|_wgetenv|secure_getenv|GETENV|ReadFile|ReadConsoleA|ReadConsoleW|InternetReadFile)$
  - focus-metavariable: $SETFN
