rules:
- id: cwe338-weak-prng-for-secret
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: A value from rand()/random() is stored as a key, token, nonce, salt, password or seed; these generators are predictable, so use a cryptographic generator instead.
  metadata:
    vulnerability_class: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)
    help: |
      ## Summary
      A value from rand()/random() is stored as a key, token, nonce, salt, password or seed; these generators are predictable, so use a cryptographic generator instead.

      ## Remediation
      Use a cryptographically secure generator (getrandom, BCryptGenRandom/CryptGenRandom, RAND_bytes) instead of rand()/random().
    category: security
    cwe:
    - 'CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)'
    references:
    - https://cwe.mitre.org/data/definitions/338.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Use a cryptographically secure generator (getrandom, BCryptGenRandom/CryptGenRandom, RAND_bytes) instead of rand()/random().
    policy_name: Weak PRNG Used for Security Value
  patterns:
  - pattern-either:
    - pattern: $X = <... $F() ...>
    - pattern: $T $X = <... $F() ...>;
    - pattern: $X[$I] = <... $F() ...>
  - metavariable-regex:
      metavariable: $F
      regex: ^(rand|random|drand48|lrand48|mrand48)$
  - metavariable-regex:
      metavariable: $X
      regex: (?i)^.*(key|token|nonce|salt|passw|pwd|secret|session|seed|iv|otp|challenge|csrf|cookie).*$
