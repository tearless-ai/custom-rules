rules:
- id: cwe457-local-object-field-read-but-never-assigned
  languages:
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A field of a local object that has no initializer is read, but neither the object nor the field
    is ever assigned in the function, so the field value is indeterminate unless the type has a constructor
    that sets it.
  metadata:
    vulnerability_class: Use of Uninitialized Variable
    help: |
      ## Summary
      A field of a local object that has no initializer is read, but neither the object nor the field is ever assigned in the function, so the field value is indeterminate unless the type has a constructor that sets it.

      ## Remediation
      Initialize every variable before it is read.
    category: security
    cwe:
    - 'CWE-457: Use of Uninitialized Variable'
    references:
    - https://cwe.mitre.org/data/definitions/457.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Initialize every variable before it is read.
  patterns:
  - pattern-inside: |
      $R $FN(...) { ... $T $X; ... }
  - metavariable-regex:
      metavariable: $T
      regex: ^(?!(std::|const\b)).*[^*]$
  - pattern-not-inside: |
      $R $FN(...) { ... $T2 $X[$N]; ... }
  - pattern-not-inside: |
      $R $FN(...) { ... <... $X = $V ...>; ... }
  - pattern-not-inside: |
      $R $FN(...) { ... <... $X.$FLD = $V ...>; ... }
  - pattern-not-inside: |
      $R $FN(...) { ... <... $X[$I] = $V ...>; ... }
  - pattern-not-inside: |
      $R $FN(...) { ... <... &$X ...>; ... }
  - pattern-not-inside: |
      $R $FN(...) { ... <... &$X.$FLD ...>; ... }
  - pattern-not-inside: |
      $R $FN(...) { ... <... $STREAM >> $X ...>; ... }
  - pattern-not-inside: |
      $R2 $SRC(..., $PT &$P, ...) { ... $P = $V; ... }
      ...
      $R $FN(...) { ... $SRC(..., $X, ...); ... }
  - pattern-not-inside: |
      $R2 $SRC(..., $PT &$P, ...) { ... $P.$PF = $V; ... }
      ...
      $R $FN(...) { ... $SRC(..., $X, ...); ... }
  - pattern-not-inside: |
      $R2 $SRC(..., $PT &$P, ...);
      ...
      $R $FN(...) { ... $SRC(..., $X, ...); ... }
  - pattern: $G(..., $X.$FLD, ...)
  - pattern-not: sizeof($X)
  - pattern-not-inside: |
      $R2 $G(..., $PT &$P, ...) { ... }
      ...
  - pattern-not-inside: |
      $R2 $G(..., $PT &$P, ...);
      ...
