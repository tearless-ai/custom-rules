                ...
                $MS($A, $C, $L);
                ...
                $GV = $A;
                ...
                $SINK();
                ...
              }
          - metavariable-regex:
              metavariable: $HF
              regex: ^(malloc|calloc|realloc)$
          - metavariable-regex:
