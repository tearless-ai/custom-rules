rules:
- id: cwe252-input-or-file-operation-result-ignored
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: The return value of this input, file-system or privilege call is discarded, so a failure goes unnoticed and the program continues with stale data or the wrong state.
  metadata:
    vulnerability_class: Unchecked Return Value
    help: |
      ## Summary
      The return value of this input, file-system or privilege call is discarded, so a failure goes unnoticed and the program continues with stale data or the wrong state.

      ## Remediation
      Check the return value of every call that can fail and handle the error before using any output of the call.
    category: security
    cwe:
    - 'CWE-252: Unchecked Return Value'
    references:
    - https://cwe.mitre.org/data/definitions/252.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Check the return value of every call that can fail and handle the error before using any output of the call.
    policy_name: 'Unchecked Return Value: Input, File or Privilege Call'
  patterns:
  - pattern: $F(...);
  - pattern-not: $X = $F(...);
  - pattern-not: $X = ($T) $F(...);
  - metavariable-regex:
      metavariable: $F
      regex: ^(fgets|fgetws|fread|fscanf|fwscanf|scanf|wscanf|sscanf|swscanf|remove|_wremove|REMOVE|rename|_wrename|RENAME|ImpersonateSelf|ImpersonateNamedPipeClient|ImpersonateLoggedOnUser|RpcImpersonateClient|SetThreadToken|setuid|setgid|seteuid|setegid|chdir|chroot)$
