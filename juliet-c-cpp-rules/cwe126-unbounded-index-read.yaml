rules:
- id: cwe126-unbounded-index-read
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: An array is read at an index that comes from input without checking the index against the upper
    bound of the array.
  metadata:
    vulnerability_class: Buffer Over-read
    help: |
      ## Summary
      An array is read at an index that comes from input without checking the index against the upper bound of the array.

      ## Remediation
      Bound reads by the source buffer's real size, ensure strings are NUL-terminated after strncpy/memcpy, and validate indexes against the buffer length.
    category: security
    cwe:
    - 'CWE-126: Buffer Over-read'
    references:
    - https://cwe.mitre.org/data/definitions/126.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Bound reads by the source buffer's real size, ensure strings are NUL-terminated after
      strncpy/memcpy, and validate indexes against the buffer length.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern-inside: |
            $RT $F(...) { ... $P = $E; ... }
        - metavariable-pattern:
            metavariable: $E
            pattern-either:
            - pattern: atoi(...)
            - pattern: atol(...)
            - pattern: atoll(...)
            - pattern: strtol(...)
            - pattern: strtoul(...)
            - pattern: strtoll(...)
            - pattern: rand()
            - pattern: RAND32()
      - pattern-inside: |
          $RT $F(...) { ... fscanf($FP, $FMT, &$P); ... }
      - pattern-inside: |
          $RT $F(...) { ... scanf($FMT, &$P); ... }
    - pattern: $P
  - patterns:
    - pattern-either:
      - patterns:
        - pattern-inside: |
            $RT $F(...) { ... $P = $E; ... }
        - metavariable-pattern:
            metavariable: $E
            pattern-either:
            - pattern: atoi(...)
            - pattern: atol(...)
            - pattern: atoll(...)
            - pattern: strtol(...)
            - pattern: strtoul(...)
            - pattern: strtoll(...)
            - pattern: rand()
            - pattern: RAND32()
      - pattern-inside: |
          $RT $F(...) { ... fscanf($FP, $FMT, &$P); ... }
      - pattern-inside: |
          $RT $F(...) { ... scanf($FMT, &$P); ... }
    - pattern-inside: |
        $RT $F(...) { ... *$Q1 = $P; ... }
    - pattern-inside: |
        $RT $F(...) { ... $T1 $Q1 = &$V; ... }
    - pattern-inside: |
        $RT $F(...) { ... $T2 $Q2 = &$V; ... }
    - pattern: '*$Q2'
  pattern-propagators:
  - pattern: $U.$FLD = $X
    from: $X
    to: $U
  pattern-sinks:
  - patterns:
    - pattern: $BUF[$IDX]
    - pattern-not-inside: $BUF[$IDX] = $V
    - metavariable-regex:
        metavariable: $IDX
        regex: ^[A-Za-z_]\w*$
    - pattern-not-inside: if (<... $IDX < $HI ...>) { ... }
    - pattern-not-inside: if (<... $IDX <= $HI ...>) { ... }
    - pattern-not-inside: if (<... $HI > $IDX ...>) { ... }
    - pattern-not-inside: if (<... $HI >= $IDX ...>) { ... }
    - pattern-not-inside: if (<... $IDX < $HI ...>) { ... } else { ... }
    - pattern-not-inside: if (<... $IDX <= $HI ...>) { ... } else { ... }
    - pattern-not-inside: if (<... $HI > $IDX ...>) { ... } else { ... }
    - pattern-not-inside: if (<... $HI >= $IDX ...>) { ... } else { ... }
    - focus-metavariable: $IDX
