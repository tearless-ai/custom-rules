rules:
- id: cwe90-ldap-injection-via-sink-function
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: An LDAP search is run with a filter built from data inside a function whose caller reads untrusted input from the console, a file, a socket or the environment and passes the data in, so that input can change the meaning of the query.
  metadata:
    vulnerability_class: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')
    help: |
      ## Summary
      An LDAP search is run with a filter built from data inside a function whose caller reads untrusted input from the console, a file, a socket or the environment and passes the data in, so that input can change the meaning of the query.

      ## Remediation
      Escape LDAP filter metacharacters in untrusted input (RFC 4515) or build filters from an allow-list of values.
    category: security
    cwe:
    - 'CWE-90: Improper Neutralization of Special Elements used in an LDAP Query (''LDAP Injection'')'
    references:
    - https://cwe.mitre.org/data/definitions/90.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Escape LDAP filter metacharacters in untrusted input (RFC 4515) or build filters from an allow-list of values.
    policy_name: LDAP Injection from Untrusted Input (Passed to Helper)
  patterns:
  - pattern: $LDAPFN($LD, $BASE, $SCOPE, $FILTER, ...)
  - metavariable-regex:
      metavariable: $LDAPFN
      regex: ^(ldap_search|ldap_search_s|ldap_search_st|ldap_search_ext|ldap_search_ext_s|ldap_searchA|ldap_searchW|ldap_search_sA|ldap_search_sW|ldap_search_stA|ldap_search_stW|ldap_search_extA|ldap_search_extW|ldap_search_ext_sA|ldap_search_ext_sW)$
  - metavariable-regex:
      metavariable: $FILTER
      regex: ^(?!\s*(L|u8|u|U)?\")(?!\s*[A-Z][A-Z0-9_]*\s*$)
  - pattern-inside: |
      $T_SINKFN $SINKFN(...) {
        ...
      }
  - pattern-either:
    - pattern-inside: |
        $T_SINKFN $SINKFN(...) {
          ...
        }
        ...
        $T_CALLER $CALLER(...) {
          ...
          <... $SRC(...) ...>;
          ...
          <... $SINKFN(...) ...>;
          ...
        }
    - pattern-inside: |
        $T_CALLER $CALLER(...) {
          ...
          <... $SRC(...) ...>;
          ...
          <... $SINKFN(...) ...>;
          ...
        }
        ...
        $T_SINKFN $SINKFN(...) {
          ...
        }
    - pattern-inside: |
        $T_SINKFN $SINKFN(...) {
          ...
        }
        ...
        $T_CALLER $CALLER(...) {
          ...
          $FPT $FP = $SINKFN;
          ...
          <... $SRC(...) ...>;
          ...
        }
    - pattern-inside: |
        $T_CALLER $CALLER(...) {
          ...
          $FPT $FP = $SINKFN;
          ...
          <... $SRC(...) ...>;
          ...
        }
        ...
        $T_SINKFN $SINKFN(...) {
          ...
        }
  - metavariable-regex:
      metavariable: $SRC
      regex: ^(?:std::)?(fgets|fgetws|gets|_getws|getline|getdelim|scanf|wscanf|fscanf|fwscanf|read|_read|recv|recvfrom|recvmsg|WSARecv|WSARecvFrom|getenv|_wgetenv|secure_getenv|GETENV|ReadFile|ReadConsoleA|ReadConsoleW|InternetReadFile)$
  - focus-metavariable: $LDAPFN
