rules:
- id: cwe126-unterminated-copy-used-as-string
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: A character buffer is completely filled by a bounded copy from a longer string and then passed on without a null terminator, so string readers run past its end.
  metadata:
    vulnerability_class: Buffer Over-read
    help: |
      ## Summary
      A character buffer is completely filled by a bounded copy from a longer string and then passed on without a null terminator, so string readers run past its end.

      ## Remediation
      Bound reads by the source buffer's real size, ensure strings are NUL-terminated after strncpy/memcpy, and validate indexes against the buffer length.
    category: security
    cwe:
    - 'CWE-126: Buffer Over-read'
    references:
    - https://cwe.mitre.org/data/definitions/126.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Bound reads by the source buffer's real size, ensure strings are NUL-terminated after strncpy/memcpy, and validate indexes against the buffer length.
    policy_name: 'Buffer Over-read: Unterminated String After Bounded Copy'
  patterns:
  - pattern-either:
    - pattern-inside: |
        $CT $S[$SN];
        ...
    - pattern-inside: |
        $CT $S[$SN] = $SI;
        ...
  - pattern-inside: |
      $CT $D[$DN];
      ...
  - metavariable-regex:
      metavariable: $CT
      regex: ^(char|wchar_t)$
  - pattern-either:
    - pattern-inside: |
        strncpy($D, $S, $N);
        ...
    - pattern-inside: |
        wcsncpy($D, $S, $N);
        ...
    - pattern-inside: |
        memcpy($D, $S, $N * $ESZ);
        ...
    - pattern-inside: |
        memmove($D, $S, $N * $ESZ);
        ...
    - pattern-inside: |
        for ($I = 0; $I < $N; $I++) { ... $D[$I] = $S[$I]; ... }
        ...
  - metavariable-comparison:
      comparison: int($N) >= int($DN) - 1 and int($SN) > int($N)
  - pattern-not-inside: |
      $D[$J] = $Z;
      ...
  - pattern-not-inside: |
      *$D = $Z;
      ...
  - pattern: $FN(..., $D, ...)
  - metavariable-regex:
      metavariable: $FN
      regex: ^(?!(mem|wmem)(set|cpy|move|cmp)$|(str|wcs)n?cpy$|sizeof$|free$)
