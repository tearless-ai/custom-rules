rules:
- id: cwe570-constant-condition
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: This condition always evaluates to false because both operands are compile-time constants.
  metadata:
    vulnerability_class: Expression is Always False
    help: |
      ## Summary
      This condition always evaluates to false because both operands are compile-time constants.

      ## Remediation
      Fix conditions that are always false; they indicate a logic error or dead code.
    category: correctness
    cwe:
    - 'CWE-570: Expression is Always False'
    references:
    - https://cwe.mitre.org/data/definitions/570.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Fix conditions that are always false; they indicate a logic error or dead code.
  patterns:
  - pattern-either:
    - pattern: if (0) $S;
    - pattern: if (0) $S; else $S2;
    - patterns:
      - pattern: if ($A == $B) $S;
      - metavariable-comparison:
          comparison: not ($A == $B)
    - patterns:
      - pattern: if ($A != $B) $S;
      - metavariable-comparison:
          comparison: not ($A != $B)
    - patterns:
      - pattern: if ($A < $B) $S;
      - metavariable-comparison:
          comparison: not ($A < $B)
    - patterns:
      - pattern: if ($A <= $B) $S;
      - metavariable-comparison:
          comparison: not ($A <= $B)
    - patterns:
      - pattern: if ($A > $B) $S;
      - metavariable-comparison:
          comparison: not ($A > $B)
    - patterns:
      - pattern: if ($A >= $B) $S;
      - metavariable-comparison:
          comparison: not ($A >= $B)
