rules:
- id: cwe121-copy-count-exceeds-stack-buffer
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: This copy writes more elements than the stack buffer '$DST' was allocated with; the element count exceeds the destination capacity and overflows it.
  metadata:
    vulnerability_class: Stack-based Buffer Overflow
    help: |
      ## Summary
      This copy writes more elements than the stack buffer '`$DST`' was allocated with; the element count exceeds the destination capacity and overflows it.

      ## Remediation
      Bound every copy and index by the destination's size (sizeof the array), use size-checked APIs such as snprintf, and validate lengths and indexes from input before use.
    category: security
    cwe:
    - 'CWE-121: Stack-based Buffer Overflow'
    references:
    - https://cwe.mitre.org/data/definitions/121.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Bound every copy and index by the destination's size (sizeof the array), use size-checked APIs such as snprintf, and validate lengths and indexes from input before use.
  patterns:
  - pattern-either:
    - pattern-either:
      - pattern: memcpy($DST, $SRC, $M * sizeof(...))
      - pattern: memmove($DST, $SRC, $M * sizeof(...))
      - pattern: wmemcpy($DST, $SRC, $M)
      - pattern: wmemmove($DST, $SRC, $M)
    - patterns:
      - pattern-inside: for ($I = $Z; $I < $M; $I++) { ... }
      - pattern: $DST[$I] = $E;
    - pattern-either:
      - pattern: strncpy($DST, $SRC, $M)
      - pattern: wcsncpy($DST, $SRC, $M)
      - pattern: strncat($DST, $SRC, $M)
      - pattern: wcsncat($DST, $SRC, $M)
    - pattern-either:
      - pattern: snprintf($DST, $M, ...)
      - pattern: _snprintf($DST, $M, ...)
      - pattern: _snwprintf($DST, $M, ...)
      - pattern: swprintf($DST, $M, ...)
      - pattern: vsnprintf($DST, $M, ...)
      - pattern: SNPRINTF($DST, $M, ...)
  - pattern-either:
    - pattern-either:
      - patterns:
        - pattern-either:
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $T $BUF[$N];
                ...
              }
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $T $BUF[$N] = $INIT;
                ...
              }
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $V = $BUF;
              ...
            }
      - pattern-either:
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $T $V[$N];
              ...
            }
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $T $V[$N] = $INIT;
              ...
            }
      - patterns:
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $BUF = ($T2 *)$AF($N * sizeof(...));
              ...
            }
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $V = $BUF;
              ...
            }
        - metavariable-regex:
            metavariable: $AF
            regex: ^(alloca|_alloca|ALLOCA)$
      - patterns:
