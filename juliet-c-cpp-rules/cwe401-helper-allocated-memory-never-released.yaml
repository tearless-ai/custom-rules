          - pattern-not-inside: |
              $R $G(...) { ... $PT $P = &$PV; ... }
      - pattern-not-inside:
          patterns:
          - pattern-inside: |
              $R $G(...) { ... $Y = $X; ... }
          - metavariable-regex:
              metavariable: $Y
              regex: ^\w+$
          - metavariable-comparison:
              comparison: str($Y) != str($X)
          - pattern-not-inside: |
              $R $G(...) { ... $YT $Y = $X; ... }
      - pattern-not-inside:
          patterns:
          - pattern-either:
            - pattern-inside: |
                $R $G(...) { ... $CALLEE(..., $X, ...); ... }
            - pattern-inside: |
                $R $G(...) { ... $CALLEE(..., &$X, ...); ... }
          - metavariable-regex:
              metavariable: $CALLEE
              regex: ^(?!(str|wcs|mem|print|puts|fputs|putws|fputws|fwrite|fread|fgets|fgetws|realloc|scanf|sscanf|fscanf|swscanf|atoi|atol|atof|isalnum|isdigit|isspace|toupper|tolower)\w*$)
          - metavariable-comparison:
              comparison: str($CALLEE) != str($S)
      - pattern-either:
        - pattern: $X = $S(...);
        - pattern: $XT $X = $S(...);
        - pattern: $S($X);
