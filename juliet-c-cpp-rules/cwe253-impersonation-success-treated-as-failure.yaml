rules:
- id: cwe253-impersonation-success-treated-as-failure
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: The result of $F() is tested with the wrong sense, so the code bails out when impersonation succeeds and continues when it fails.
  metadata:
    vulnerability_class: Incorrect Check of Function Return Value
    help: |
      ## Summary
      The result of `$F()` is tested with the wrong sense, so the code bails out when impersonation succeeds and continues when it fails.

      ## Remediation
      Compare return values against the function's documented error value (e.g. EOF, NULL, INVALID_HANDLE_VALUE, -1) rather than an assumed one.
    category: security
    cwe:
    - 'CWE-253: Incorrect Check of Function Return Value'
    references:
    - https://cwe.mitre.org/data/definitions/253.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Compare return values against the function's documented error value (e.g. EOF, NULL, INVALID_HANDLE_VALUE, -1) rather than an assumed one.
  patterns:
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern: if ($F(...) > 0) { ... }
        - pattern: if ($F(...) == TRUE) { ... }
        - pattern: if ($F(...) != 0) { ... }
        - pattern: if ($F(...) != FALSE) { ... }
      - metavariable-regex:
          metavariable: $F
          regex: ^(ImpersonateSelf|ImpersonateNamedPipeClient|ImpersonateLoggedOnUser|ImpersonateAnonymousToken|SetThreadToken|RevertToSelf|AdjustTokenPrivileges)$
    - patterns:
      - pattern: if ($F(...) == RPC_S_OK) { ... }
      - metavariable-regex:
          metavariable: $F
          regex: ^(RpcImpersonateClient|RpcRevertToSelf|RpcRevertToSelfEx)$
  - pattern-either:
    - pattern: if ($C) { ... exit(...); ... }
    - pattern: if ($C) { ... abort(); ... }
    - pattern: if ($C) { ... return ...; }
  - focus-metavariable: $C
