rules:
- id: cwe134-format-string-via-source-function
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A printf-family function is called with a format string that is a variable rather than a literal on data returned by a helper that reads untrusted input from the console, a file, a socket or the environment, so that input can supply format specifiers that read or write memory.
  metadata:
    vulnerability_class: Use of Externally-Controlled Format String
    help: |
      ## Summary
      A printf-family function is called with a format string that is a variable rather than a literal on data returned by a helper that reads untrusted input from the console, a file, a socket or the environment, so that input can supply format specifiers that read or write memory.

      ## Remediation
      Always pass a string literal as the format argument, e.g. printf("%s", data) instead of printf(data).
    category: security
    cwe:
    - 'CWE-134: Use of Externally-Controlled Format String'
    references:
    - https://cwe.mitre.org/data/definitions/134.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Always pass a string literal as the format argument, e.g. printf("%s", data) instead of printf(data).
    policy_name: Uncontrolled Format String (Read in Helper)
  patterns:
  - pattern-either:
    - patterns:
      - pattern: $PRINTF($FMT, ...)
      - metavariable-regex:
          metavariable: $PRINTF
          regex: ^(printf|wprintf|vprintf|vwprintf|_printf_l|_wprintf_l)$
    - patterns:
      - pattern: $PRINTF($DST, $FMT, ...)
      - metavariable-regex:
          metavariable: $PRINTF
          regex: ^(fprintf|fwprintf|vfprintf|vfwprintf|sprintf|vsprintf|dprintf|vdprintf|syslog|vsyslog|asprintf|vasprintf|wsprintfA|wsprintfW|wvsprintfA|wvsprintfW)$
    - patterns:
      - pattern: $PRINTF($DST, $N, $FMT, ...)
      - metavariable-regex:
          metavariable: $PRINTF
          regex: ^(SNPRINTF|snprintf|_snprintf|_snwprintf|swprintf|vsnprintf|_vsnprintf|_vsnwprintf|vswprintf|StringCchPrintfA|StringCchPrintfW|StringCbPrintfA|StringCbPrintfW)$
  - metavariable-regex:
      metavariable: $FMT
      regex: ^(?!\s*(L|u8|u|U)?\")(?!\s*[A-Z][A-Z0-9_]*\s*$)
  - pattern-either:
    - pattern-inside: |
        $T_SRCFN $SRCFN(...) {
          ...
          <... $SRC(...) ...>;
          ...
        }
        ...
        $T_F $F(...) {
          ...
          <... $SRCFN(...) ...>;
          ...
        }
    - pattern-inside: |
        $T_F $F(...) {
          ...
          <... $SRCFN(...) ...>;
          ...
        }
        ...
        $T_SRCFN $SRCFN(...) {
          ...
          <... $SRC(...) ...>;
          ...
        }
  - pattern-inside: |
      $T_F $F(...) {
        ...
      }
  - pattern-inside: |
      <... $SRCFN(...) ...>;
      ...
  - metavariable-regex:
      metavariable: $SRC
      regex: ^(?:std::)?(fgets|fgetws|gets|_getws|getline|getdelim|scanf|wscanf|fscanf|fwscanf|read|_read|recv|recvfrom|recvmsg|WSARecv|WSARecvFrom|getenv|_wgetenv|secure_getenv|GETENV|ReadFile|ReadConsoleA|ReadConsoleW|InternetReadFile)$
  - focus-metavariable: $PRINTF
