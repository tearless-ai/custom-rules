rules:
- id: cwe122-struct-size-copied-into-member-of-heap-struct
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A copy into one member array of a heap structure uses the size of the whole structure, overrunning the member.
  metadata:
    vulnerability_class: Heap-based Buffer Overflow
    help: |
      ## Summary
      A copy into one member array of a heap structure uses the size of the whole structure, overrunning the member.

      ## Remediation
      Allocate enough room for the data including the terminator, bound every copy and index by the allocation size, and validate lengths and indexes from input before use.
    category: security
    cwe:
    - 'CWE-122: Heap-based Buffer Overflow'
    references:
    - https://cwe.mitre.org/data/definitions/122.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Allocate enough room for the data including the terminator, bound every copy and index by the allocation size, and validate lengths and indexes from input before use.
    policy_name: 'Heap Buffer Overflow: Whole Struct Size Copied Into Member'
  patterns:
  - pattern-either:
    - pattern: memcpy($S->$FLD, $X, sizeof(*$S))
    - pattern: memmove($S->$FLD, $X, sizeof(*$S))
  - pattern-either:
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $S = ($T2 *)malloc(...);
          ...
        }
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $S = ($T2 *)calloc(...);
          ...
        }
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $S = ($T2 *)realloc(...);
          ...
        }
