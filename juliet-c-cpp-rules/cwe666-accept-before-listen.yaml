rules:
- id: cwe666-accept-before-listen
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: accept() is called on a socket that has not yet been put into the listening state with listen(), so the call fails and the server never accepts connections.
  metadata:
    vulnerability_class: Operation on Resource in Wrong Phase of Lifetime
    help: |
      ## Summary
      accept() is called on a socket that has not yet been put into the listening state with listen(), so the call fails and the server never accepts connections.

      ## Remediation
      Only operate on resources that are in the correct lifecycle state (e.g. do not use a handle before it is opened).
    category: security
    cwe:
    - 'CWE-666: Operation on Resource in Wrong Phase of Lifetime'
    references:
    - https://cwe.mitre.org/data/definitions/666.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Only operate on resources that are in the correct lifecycle state (e.g. do not use a handle before it is opened).
  patterns:
  - pattern-either:
    - pattern: |
        $R $F(...) { ... if (<... $ACC($S, ...) ...>) { ... } ... }
    - pattern: |
        $R $F(...) { ... $ACC($S, ...); ... }
    - pattern: |
        $R $F(...) { ... $RV = $ACC($S, ...); ... }
  - pattern-not: |
      $R $F(...) { ... if (<... listen($S, ...) ...>) { ... } ... if (<... $ACC($S, ...) ...>) { ... } ... }
  - pattern-not: |
      $R $F(...) { ... if (<... listen($S, ...) ...>) { ... } ... $ACC($S, ...); ... }
  - pattern-not: |
      $R $F(...) { ... if (<... listen($S, ...) ...>) { ... } ... $RV = $ACC($S, ...); ... }
  - pattern-not: |
      $R $F(...) { ... listen($S, ...); ... if (<... $ACC($S, ...) ...>) { ... } ... }
  - pattern-not: |
      $R $F(...) { ... listen($S, ...); ... $ACC($S, ...); ... }
  - pattern-not: |
      $R $F(...) { ... listen($S, ...); ... $RV = $ACC($S, ...); ... }
  - pattern-not: |
      $R $F(...) { ... $RV = listen($S, ...); ... if (<... $ACC($S, ...) ...>) { ... } ... }
  - pattern-not: |
      $R $F(...) { ... $RV = listen($S, ...); ... $ACC($S, ...); ... }
  - pattern-not: |
      $R $F(...) { ... $RV = listen($S, ...); ... $RV = $ACC($S, ...); ... }
  - pattern-not: |
      $R $F(...) { ... if (<... bind($S, ...) ...>) { ... } ... if (<... $ACC($S, ...) ...>) { ... } ... }
  - pattern-not: |
      $R $F(...) { ... if (<... bind($S, ...) ...>) { ... } ... $ACC($S, ...); ... }
  - pattern-not: |
      $R $F(...) { ... if (<... bind($S, ...) ...>) { ... } ... $RV = $ACC($S, ...); ... }
  - pattern-not: |
      $R $F(...) { ... bind($S, ...); ... if (<... $ACC($S, ...) ...>) { ... } ... }
  - pattern-not: |
      $R $F(...) { ... bind($S, ...); ... $ACC($S, ...); ... }
  - pattern-not: |
      $R $F(...) { ... bind($S, ...); ... $RV = $ACC($S, ...); ... }
  - pattern-not: |
      $R $F(...) { ... $RV = bind($S, ...); ... if (<... $ACC($S, ...) ...>) { ... } ... }
  - pattern-not: |
      $R $F(...) { ... $RV = bind($S, ...); ... $ACC($S, ...); ... }
  - pattern-not: |
      $R $F(...) { ... $RV = bind($S, ...); ... $RV = $ACC($S, ...); ... }
  - metavariable-regex:
      metavariable: $ACC
      regex: ^(accept|accept4|WSAAccept)$
  - focus-metavariable: $ACC
