rules:
- id: cwe416-use-after-free-cpp
  languages:
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A pointer is dereferenced, returned or passed to a routine that accesses it after the memory it points to was released.
  metadata:
    vulnerability_class: Use After Free
    help: |
      ## Summary
      A pointer is dereferenced, returned or passed to a routine that accesses it after the memory it points to was released.

      ## Remediation
      Do not use memory after it has been freed; set pointers to NULL after free and restructure ownership so no stale references remain.
    category: security
    cwe:
    - 'CWE-416: Use After Free'
    references:
    - https://cwe.mitre.org/data/definitions/416.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Do not use memory after it has been freed; set pointers to NULL after free and restructure ownership so no stale references remain.
    policy_name: 'Use After Free: Released Pointer Used (C++)'
  mode: taint
  pattern-sources:
  - by-side-effect: only
    patterns:
    - pattern: free($X);
    - focus-metavariable: $X
  - by-side-effect: only
    patterns:
    - pattern: delete $X;
    - focus-metavariable: $X
  - by-side-effect: only
    patterns:
    - pattern: delete [] $X;
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern: $UF(..., $X, ...)
        - metavariable-regex:
            metavariable: $UF
            regex: ^(str|wcs|mem|print|puts|fputs|putws|fputws|fwrite|fread|fgets|fgetws|scanf|sscanf|fscanf|swscanf|atoi|atol|atof|sprintf|snprintf|swprintf|fprintf|vsprintf|vfprintf)\w*$
        - metavariable-regex:
            metavariable: $X
            regex: ^[A-Za-z_]\w*$
      - pattern: $X[$UI]
      - pattern: '*$X'
      - pattern: $X->$UFLD
      - pattern: return $X;
    - metavariable-regex:
        metavariable: $X
        regex: ^[^&]
    - pattern-not-inside: for (...) { ... free($X); ... }
    - pattern-not-inside: while ($LC) { ... free($X); ... }
    - pattern-not-inside: for (...) { ... delete $X; ... }
    - pattern-not-inside: for (...) { ... delete [] $X; ... }
    - pattern-not-inside: while ($LC) { ... delete $X; ... }
    - pattern-not-inside: while ($LC) { ... delete [] $X; ... }
    - focus-metavariable: $X
