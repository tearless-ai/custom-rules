rules:
- id: cwe758-read-uninitialized-heap-memory
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: Freshly allocated heap or stack memory is read through a pointer before anything was written to it, so the value is indeterminate and the behavior is undefined.
  metadata:
    vulnerability_class: Reliance on Undefined, Unspecified, or Implementation-Defined Behavior
    help: |
      ## Summary
      Freshly allocated heap or stack memory is read through a pointer before anything was written to it, so the value is indeterminate and the behavior is undefined.

      ## Remediation
      Avoid undefined behavior: do not read uninitialized memory, and always return a value from non-void functions.
    category: correctness
    cwe:
    - 'CWE-758: Reliance on Undefined, Unspecified, or Implementation-Defined Behavior'
    references:
    - https://cwe.mitre.org/data/definitions/758.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: 'Avoid undefined behavior: do not read uninitialized memory, and always return a value from non-void functions.'
    policy_name: 'Undefined Behavior: Read of Uninitialized Allocated Memory'
  patterns:
  - pattern-either:
    - pattern-inside: |
        $T $P = ($C) malloc(...);
        ...
    - pattern-inside: |
        $T $P = ($C) alloca(...);
        ...
    - pattern-inside: |
        $T $P = ($C) ALLOCA(...);
        ...
    - pattern-inside: |
        $T $P = ($C) realloc(NULL, ...);
        ...
    - pattern-inside: |
        $T $P = new $TY;
        ...
  - pattern-not-inside: |
      *$P = $V;
      ...
  - pattern-not-inside: |
      $P->$F = $V;
      ...
  - pattern-not-inside: |
      memset($P, ...);
      ...
  - pattern-not-inside: |
      memcpy($P, ...);
      ...
  - pattern-not-inside: |
      $FN(..., $P, ...);
      ...
  - pattern-either:
    - pattern: $T2 $D = *$P;
    - pattern: $D = *$P;
    - pattern: $FN2(..., *$P, ...)
