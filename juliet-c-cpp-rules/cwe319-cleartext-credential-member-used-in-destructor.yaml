rules:
- id: cwe319-cleartext-credential-member-used-in-destructor
  languages:
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A class constructor receives a credential from the network with $RECV() and the destructor
    uses it for authentication without decrypting it, so it travels in cleartext.
  metadata:
    vulnerability_class: Cleartext Transmission of Sensitive Information
    help: |
      ## Summary
      A class constructor receives a credential from the network with `$RECV()` and the destructor uses it for authentication without decrypting it, so it travels in cleartext.

      ## Remediation
      Encrypt sensitive data in transit with TLS instead of sending it over plain sockets.
    category: security
    cwe:
    - 'CWE-319: Cleartext Transmission of Sensitive Information'
    references:
    - https://cwe.mitre.org/data/definitions/319.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Encrypt sensitive data in transit with TLS instead of sending it over plain sockets.
  patterns:
  - pattern: $RECV($SOCK, $BUF, ...)
  - metavariable-regex:
      metavariable: $RECV
      regex: ^(recv|recvfrom|recvmsg|WSARecv|WSARecvFrom|read)$
  - pattern-inside: |
      $T_C $CTOR(...) { ... }
      ...
      $T_D $DTOR(...) {
        ...
        <... $LOGON(...) ...>;
        ...
      }
  - pattern-inside: |
      $T_C $CTOR(...) { ... }
  - metavariable-regex:
      metavariable: $CTOR
      regex: ^(?:\w+::)*(\w+)::\1$
  - metavariable-regex:
      metavariable: $DTOR
      regex: ^(?:\w+::)*(\w+)::~\1$
  - metavariable-regex:
      metavariable: $LOGON
      regex: ^(LogonUser|LogonUserA|LogonUserW|LogonUserExA|LogonUserExW|pam_authenticate|crypt|crypt_r)$
  - pattern-not-inside: |
      $T_C $CTOR(...) { ... }
      ...
      $T_D2 $DTOR2(...) {
        ...
        <... CryptDecrypt(...) ...>;
        ...
      }
  - pattern-not-inside: |
      $T_C $CTOR(...) { ... }
      ...
      $T_D2 $DTOR2(...) {
        ...
        <... BCryptDecrypt(...) ...>;
        ...
      }
  - pattern-not-inside: |
      $T_C $CTOR(...) { ... }
      ...
      $T_D2 $DTOR2(...) {
        ...
        <... CryptUnprotectData(...) ...>;
        ...
      }
  - pattern-not-inside: |
      $T_C $CTOR(...) { ... }
      ...
      $T_D2 $DTOR2(...) {
        ...
        <... EVP_DecryptUpdate(...) ...>;
        ...
      }
  - pattern-not-inside: |
      $T_C $CTOR(...) { ... }
      ...
      $T_D2 $DTOR2(...) {
        ...
        <... EVP_OpenUpdate(...) ...>;
        ...
      }
  - focus-metavariable: $RECV
