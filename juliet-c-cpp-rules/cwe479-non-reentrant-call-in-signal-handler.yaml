rules:
- id: cwe479-non-reentrant-call-in-signal-handler
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A function that is not async-signal-safe (such as malloc, free or printf) is called from an installed signal handler, which can corrupt heap or stdio state.
  metadata:
    vulnerability_class: Signal Handler Use of a Non-reentrant Function
    help: |
      ## Summary
      A function that is not async-signal-safe (such as malloc, free or printf) is called from an installed signal handler, which can corrupt heap or stdio state.

      ## Remediation
      Call only async-signal-safe functions from signal handlers.
    category: security
    cwe:
    - 'CWE-479: Signal Handler Use of a Non-reentrant Function'
    references:
    - https://cwe.mitre.org/data/definitions/479.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Call only async-signal-safe functions from signal handlers.
    policy_name: Signal Handler Calls Non-Reentrant Function
  patterns:
  - pattern-inside: |
      $R $H($T $SG) { ... }
      ...
      signal($SIGNUM, $H);
  - pattern-inside: |
      $R $H($T $SG) { ... }
  - pattern: $FN(...)
  - metavariable-regex:
      metavariable: $FN
      regex: ^(malloc|calloc|realloc|free|printf|fprintf|sprintf|snprintf|vprintf|vfprintf|puts|fputs|fputc|putc|putchar|fwrite|fread|fgets|fopen|fclose|fflush|scanf|fscanf|strtok|localtime|gmtime|asctime|ctime|getenv|setenv|syslog|exit|rand|srand|longjmp|new|delete|wprintf|fputws|perror)$
