rules:
- id: cwe476-null-pointer-dereference
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A pointer that was set to NULL and never reassigned is dereferenced on a path where it is not checked.
  metadata:
    vulnerability_class: NULL Pointer Dereference
    help: |
      ## Summary
      A pointer that was set to NULL and never reassigned is dereferenced on a path where it is not checked.

      ## Remediation
      Check pointers for NULL before dereferencing them.
    category: security
    cwe:
    - 'CWE-476: NULL Pointer Dereference'
    references:
    - https://cwe.mitre.org/data/definitions/476.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Check pointers for NULL before dereferencing them.
    policy_name: 'NULL Pointer Dereference: Pointer Set to NULL Then Used'
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $X = $NULL
      - pattern: $DT $X = $NULL;
    - metavariable-regex:
        metavariable: $NULL
        regex: ^(NULL|nullptr)$
    - pattern-not-inside: |
        $R $F(...) { ... $X = $NULL; ... $X = $OTHER; ... }
    - pattern-not-inside: |
        $R $F(...) { ... $DT $X = $NULL; ... $X = $OTHER; ... }
    - pattern-not-inside: |
        $R $F(...) { ... <... &$X ...>; ... }
    - pattern-not-inside: |
        $HR $HF(..., $HT &$HP, ...);
        ...
        $R $F(...) { ... $HF(..., $X, ...); ... }
    - pattern-not-inside: |
        $HR $HF(..., $HT &$HP, ...) { ... }
        ...
        $R $F(...) { ... $HF(..., $X, ...); ... }
    - focus-metavariable: $NULL
  - patterns:
    - pattern-either:
      - pattern-inside: |
          if ($C) { ... $X = $NULL; ... } else { ... }
      - pattern-inside: |
          if ($C) { ... } else { ... $X = $NULL; ... }
    - pattern: $X = $NULL
    - metavariable-regex:
        metavariable: $NULL
        regex: ^(NULL|nullptr)$
    - pattern-not-inside: |
        $X = $NULL;
        ...
        $X = $OTHER;
    - pattern-not-inside: |
        if ($C) { ... } else { ... }
        ...
        $X = $OTHER;
    - pattern-not-inside: |
        $R $F(...) { ... <... &$X ...>; ... }
    - pattern-not-inside: |
        $HR $HF(..., $HT &$HP, ...);
        ...
        $R $F(...) { ... $HF(..., $X, ...); ... }
    - pattern-not-inside: |
        $HR $HF(..., $HT &$HP, ...) { ... }
        ...
        $R $F(...) { ... $HF(..., $X, ...); ... }
    - focus-metavariable: $NULL
  - patterns:
    - pattern-inside: |
        $R $CALLEE(..., $T $P, ...) { ... }
        ...
        $R2 $CALLER(...) { ... $D = NULL; ... $CALLEE(..., $D, ...); ... }
    - pattern-not-inside: |
        $R $CALLEE(..., $T $P, ...) { ... }
        ...
        $R2 $CALLER(...) { ... if (<... $D ...>) $CHK; ... }
    - pattern-not-inside: |
        $R $CALLEE(..., $T $P, ...) { ... }
        ...
        $R2 $CALLER(...) { ... $D = NULL; ... $D = $OTHER; ... }
    - pattern: |
        $R $CALLEE(..., $T $P, ...) { ... }
    - focus-metavariable: $P
  - patterns:
    - pattern-inside: |
        $R $CALLEE(..., $T $P, ...) { ... }
        ...
        $R2 $CALLER(...) { ... $FT (*$FP)(...) = $CALLEE; ... $D = NULL; ... $FP(..., $D, ...); ... }
    - pattern-not-inside: |
        $R $CALLEE(..., $T $P, ...) { ... }
        ...
        $R2 $CALLER(...) { ... if (<... $D ...>) $CHK; ... }
    - pattern-not-inside: |
        $R $CALLEE(..., $T $P, ...) { ... }
        ...
        $R2 $CALLER(...) { ... $D = NULL; ... $D = $OTHER; ... }
    - pattern: |
        $R $CALLEE(..., $T $P, ...) { ... }
    - focus-metavariable: $P
  - patterns:
    - pattern-inside: |
        $R $READER(...) { ... }
        ...
        $R2 $WRITER(...) { ... $D = NULL; ... $G = $D; ... }
    - pattern-not-inside: |
        $R $READER(...) { ... }
        ...
        $R2 $WRITER(...) { ... if (<... $D ...>) $CHK; ... }
    - pattern-not-inside: |
        $R $READER(...) { ... }
        ...
        $R2 $WRITER(...) { ... $D = NULL; ... $D = $OTHER; ... }
    - pattern-inside: |
        $R $READER(...) { ... }
    - pattern-either:
      - pattern: $LT $L = $G;
      - pattern: $L = $G
    - focus-metavariable: $G
  - patterns:
    - pattern-inside: |
        $R $HELPER(...) { ... $X = NULL; ... return $X; }
        ...
    - pattern-not-inside: |
        $R $HELPER(...) { ... if (<... $X ...>) $CHK; ... }
        ...
    - pattern: $HELPER(...)
  - patterns:
    - pattern-inside: |
        $R $HELPER(..., $T &$X, ...) { ... $X = NULL; ... }
        ...
    - pattern-not-inside: |
        $R $HELPER(..., $T &$X, ...) { ... if (<... $X ...>) $CHK; ... }
        ...
    - pattern: $HELPER($D)
    - focus-metavariable: $D
    by-side-effect: true
  - patterns:
    - pattern-inside: |
        $T &$REF = $D;
        ...
        $D = NULL;
        ...
    - pattern-not-inside: |
        $D = NULL;
        ...
        $D = $OTHER;
        ...
    - pattern: $REF
  - patterns:
    - pattern-inside: |
        $T $P1 = &$D;
        ...
        $T $P2 = &$D;
        ...
    - pattern-either:
      - pattern-inside: |
          $V = NULL;
          ...
          *$P1 = $V;
          ...
      - pattern-inside: |
          {
            ...
            $V = NULL;
            ...
            *$P1 = $V;
          }
          ...
    - pattern-not-inside: |
        $V = NULL;
        ...
        $V = $OTHER;
        ...
    - pattern: '*$P2'
  pattern-propagators:
  - patterns:
    - pattern-inside: |
        typedef union { $T1 $A; $T2 $B; } $UT;
        ...
    - pattern-inside: |
        $UT $U;
        ...
    - pattern: $U.$F1 = $D
    from: $D
    to: $U
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: $X != NULL
      - pattern: $X == NULL
      - pattern: $X != nullptr
      - pattern: $X == nullptr
      - pattern: '!$X'
      - pattern: '$X ? $A : $B'
      - pattern: assert($X)
    - focus-metavariable: $X
    by-side-effect: true
  - patterns:
    - pattern-either:
      - pattern-inside: if ($X) $S;
      - pattern-inside: if ($X) $S; else $E;
      - pattern-inside: while ($X) $S;
    - pattern: $X
    - metavariable-regex:
        metavariable: $X
        regex: ^[A-Za-z_][A-Za-z0-9_]*$
    by-side-effect: true
  pattern-sinks:
  - patterns:
    - pattern: $F($P, ...)
    - metavariable-regex:
        metavariable: $F
        regex: ^(strcpy|wcscpy|strncpy|wcsncpy|strcat|wcscat|strncat|wcsncat|memcpy|memmove|memset|wmemset|sprintf|swprintf|snprintf|_snprintf|_snwprintf|fclose|fputs|fputws|fgets|fgetws|fprintf|fwprintf|fwrite|fread|fputc|fgetc|fseek|ftell|rewind|fflush|strlen|wcslen)$
    - pattern-not-inside: sizeof(...)
    - pattern-not-inside: malloc(...)
    - pattern-not-inside: calloc(...)
    - pattern-not-inside: realloc(...)
    - focus-metavariable: $P
  - patterns:
    - pattern-either:
      - pattern: $P[$I]
      - pattern: '*$P'
      - pattern: $P->$FLD
    - pattern-not-inside: '*$P = $V'
    - pattern-not-inside: $T * $X = *$P;
    - pattern-not-inside: sizeof(...)
    - pattern-not-inside: malloc(...)
    - pattern-not-inside: calloc(...)
    - pattern-not-inside: realloc(...)
    - focus-metavariable: $P
  - patterns:
    - pattern: '*$P = $V'
    - metavariable-regex:
        metavariable: $V
        regex: ^(?![A-Za-z_][A-Za-z0-9_]*$)
    - focus-metavariable: $P
