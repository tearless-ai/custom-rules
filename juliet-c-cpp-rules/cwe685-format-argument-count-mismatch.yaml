          regex: '^L?"(?:[^%"\\]|\\.|%%)*(?:%[-+ #0]*[0-9]*(?:\.[0-9]+)?(?:hh|h|ll|l|L|q|j|z|t|I64|I32)?[diouxXeEfFgGaAcspnSC](?:[^%"\\]|\\.|%%)*){0,1}"$'
