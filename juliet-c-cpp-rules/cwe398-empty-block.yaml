rules:
- id: cwe398-empty-block
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: INFO
  message: This empty block has no effect.
  metadata:
    vulnerability_class: 7PK - Code Quality
    help: |
      ## Summary
      This empty block has no effect.

      ## Remediation
      Remove empty blocks and statements with no effect, or implement the intended logic.
    category: correctness
    cwe:
    - 'CWE-398: 7PK - Code Quality'
    references:
    - https://cwe.mitre.org/data/definitions/398.html
    confidence: LOW
    likelihood: MEDIUM
    impact: LOW
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Remove empty blocks and statements with no effect, or implement the intended logic.
  patterns:
  - pattern: '{}'
  - pattern-not-inside: $R $F(...) {}
  - pattern-not-inside: for ($I; $C; $N) {}
  - pattern-not-inside: while ($C) {}
  - pattern-not-inside: if ($C) {} else $S;
  - pattern-not-inside: if ($C) {}
  - pattern-not-inside: if ($C) $S; else {}
