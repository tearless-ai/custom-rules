rules:
- id: cwe570-unsigned-compared-with-zero
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: An unsigned value compared this way against zero is always false.
  metadata:
    vulnerability_class: Expression is Always False
    help: |
      ## Summary
      An unsigned value compared this way against zero is always false.

      ## Remediation
      Fix conditions that are always false; they indicate a logic error or dead code.
    category: correctness
    cwe:
    - 'CWE-570: Expression is Always False'
    references:
    - https://cwe.mitre.org/data/definitions/570.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Fix conditions that are always false; they indicate a logic error or dead code.
  pattern-either:
  - pattern: (unsigned int $U) < 0
  - pattern: (unsigned $U) < 0
  - pattern: (unsigned long $U) < 0
  - pattern: (size_t $U) < 0
