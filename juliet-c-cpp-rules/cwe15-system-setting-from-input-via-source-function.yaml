rules:
- id: cwe15-system-setting-from-input-via-source-function
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: System setting changed to a value taken from external data after calling a helper that fills
    the data from untrusted input (console, file, socket or environment).
  metadata:
    vulnerability_class: External Control of System or Configuration Setting
    help: |
      ## Summary
      System setting changed to a value taken from external data after calling a helper that fills the data from untrusted input (console, file, socket or environment).

      ## Remediation
      Do not let external input choose system or configuration settings such as the host name or computer name; use fixed, validated values.
    category: security
    cwe:
    - 'CWE-15: External Control of System or Configuration Setting'
    references:
    - https://cwe.mitre.org/data/definitions/15.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Do not let external input choose system or configuration settings such as the host name
      or computer name; use fixed, validated values.
  patterns:
  - pattern: $SETFN($VALUE, ...)
  - metavariable-regex:
      metavariable: $SETFN
      regex: ^(SetComputerName|SetComputerNameA|SetComputerNameW|SetComputerNameEx|SetComputerNameExA|SetComputerNameExW|sethostname|setdomainname|SetSystemTime|SetLocalTime|settimeofday|stime)$
  - metavariable-regex:
      metavariable: $VALUE
      regex: ^(?!\s*(L|u8|u|U)?\")(?!\s*[A-Z][A-Z0-9_]*\s*$)
  - pattern-either:
    - pattern-inside: |
        $T_SRCFN $SRCFN(...) {
          ...
          <... $SRC(...) ...>;
          ...
        }
        ...
        $T_F $F(...) {
          ...
          <... $SRCFN(...) ...>;
          ...
        }
    - pattern-inside: |
        $T_F $F(...) {
          ...
          <... $SRCFN(...) ...>;
          ...
        }
        ...
        $T_SRCFN $SRCFN(...) {
          ...
          <... $SRC(...) ...>;
          ...
        }
  - pattern-inside: |
      $T_F $F(...) {
        ...
      }
  - pattern-inside: |
      <... $SRCFN(...) ...>;
      ...
  - metavariable-regex:
      metavariable: $SRC
      regex: ^(?:std::)?(fgets|fgetws|gets|_getws|getline|getdelim|scanf|wscanf|fscanf|fwscanf|read|_read|recv|recvfrom|recvmsg|WSARecv|WSARecvFrom|getenv|_wgetenv|secure_getenv|GETENV|ReadFile|ReadConsoleA|ReadConsoleW|InternetReadFile)$
  - focus-metavariable: $SETFN
