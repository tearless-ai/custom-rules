rules:
- id: cwe253-pointer-return-compared-negative
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: A pointer-returning function's result is compared against a negative bound, which can never detect its NULL failure value.
  metadata:
    vulnerability_class: Incorrect Check of Function Return Value
    help: |
      ## Summary
      A pointer-returning function's result is compared against a negative bound, which can never detect its NULL failure value.

      ## Remediation
      Compare return values against the function's documented error value (e.g. EOF, NULL, INVALID_HANDLE_VALUE, -1) rather than an assumed one.
    category: security
    cwe:
    - 'CWE-253: Incorrect Check of Function Return Value'
    references:
    - https://cwe.mitre.org/data/definitions/253.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Compare return values against the function's documented error value (e.g. EOF, NULL, INVALID_HANDLE_VALUE, -1) rather than an assumed one.
    policy_name: 'Incorrect Return Check: Pointer Result Compared to Negative'
  patterns:
  - pattern-either:
    - pattern: $F(...) < 0
    - pattern: $F(...) <= -1
    - pattern: $F(...) >= 0
  - metavariable-regex:
      metavariable: $F
      regex: ^(fgets|fgetws|fopen|_wfopen|malloc|calloc|realloc|strdup|getenv|tmpfile)$
