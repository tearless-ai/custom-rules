rules:
- id: cwe252-handle-not-validated
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: The handle returned by this Windows object-creation call is never checked for failure before it is used.
  metadata:
    vulnerability_class: Unchecked Return Value
    help: |
      ## Summary
      The handle returned by this Windows object-creation call is never checked for failure before it is used.

      ## Remediation
      Check the return value of every call that can fail and handle the error before using any output of the call.
    category: security
    cwe:
    - 'CWE-252: Unchecked Return Value'
    references:
    - https://cwe.mitre.org/data/definitions/252.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Check the return value of every call that can fail and handle the error before using any output of the call.
    policy_name: 'Unchecked Return Value: Windows Object Handle'
  patterns:
  - pattern: $H = $CREATE(...);
  - metavariable-regex:
      metavariable: $CREATE
      regex: ^(CreateMutex|CreateMutexA|CreateMutexW|CreateEvent|CreateEventA|CreateEventW|CreateSemaphoreA|CreateSemaphoreW|OpenProcess|OpenThread|CreateThread)$
  - pattern-not-inside: |
      $H = $CREATE(...);
      ...
      if (<... $H ...>) { ... }
  - pattern-not-inside: |
      $H = $CREATE(...);
      ...
      if (<... $H ...>) { ... } else { ... }
