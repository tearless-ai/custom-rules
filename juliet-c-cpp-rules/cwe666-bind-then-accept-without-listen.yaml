  - pattern-not: |
      $R $F(...) { ... $RV = $BND($S, ...); ... $RV = listen($S, ...); ... $RV = accept($S, ...); ... }
  - metavariable-regex:
      metavariable: $BND
      regex: ^bind$
  - focus-metavariable: $BND
