rules:
- id: cwe457-buffer-read-after-helper-leaves-it-uninitialized
  languages:
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A newly allocated buffer is passed to a helper that never writes its elements, and the elements are then read uninitialized.
  metadata:
    vulnerability_class: Use of Uninitialized Variable
    help: |
      ## Summary
      A newly allocated buffer is passed to a helper that never writes its elements, and the elements are then read uninitialized.

      ## Remediation
      Initialize every variable before it is read.
    category: security
    cwe:
    - 'CWE-457: Use of Uninitialized Variable'
    references:
    - https://cwe.mitre.org/data/definitions/457.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Initialize every variable before it is read.
  patterns:
  - pattern-inside: |
      $R2 $SRC(..., $PT &$P, ...) { ... }
      ...
      $R $FN(...) { ... $SRC($X); ... }
  - pattern-not-inside: |
      $R2 $SRC(..., $PT &$P, ...) { ... $P[$I] = $V; ... }
      ...
  - pattern-not-inside: |
      $R2 $SRC(..., $PT &$P, ...) { ... $P[$I].$FLD = $V; ... }
      ...
  - pattern-not-inside: |
      $R2 $SRC(..., $PT &$P, ...) { ... $P = $V; ... }
      ...
  - pattern-not-inside: |
      $R2 $SRC(..., $PT &$P, ...) { ... $INIT(..., $P, ...); ... }
      ...
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern-inside: |
            $R $FN(...) { ... $X = ($CT)$ALLOC(...); ... }
        - pattern-inside: |
            $R $FN(...) { ... $X = reinterpret_cast<$CT>($ALLOC(...)); ... }
      - metavariable-regex:
          metavariable: $ALLOC
          regex: ^(malloc|alloca|_alloca|ALLOCA|realloc)$
    - pattern-inside: |
        $R $FN(...) { ... $X = new $TY[$N]; ... }
    - patterns:
      - pattern-inside: |
          $R $FN(...) { ... $AT $ARR[$N]; ... $X = $ARR; ... }
      - pattern-not-inside: |
          $R $FN(...) { ... $ARR[$I] = $V; ... }
      - pattern-not-inside: |
          $R $FN(...) { ... $ARR[$I].$FLD = $V; ... }
  - pattern-not-inside: |
      $R $FN(...) { ... $X[$I] = $V; ... }
  - pattern-not-inside: |
      $R $FN(...) { ... $X[$I].$FLD = $V; ... }
  - pattern-either:
    - pattern: $G(..., $X[$J], ...)
    - pattern: $G(..., $X[$J].$FLD, ...)
