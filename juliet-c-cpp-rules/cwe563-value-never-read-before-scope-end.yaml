rules:
- id: cwe563-value-never-read-before-scope-end
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: This is the last statement of the block that declares the local variable, so the value stored into it can never be read before the variable goes out of scope.
  metadata:
    vulnerability_class: Assignment to Variable without Use
    help: |
      ## Summary
      This is the last statement of the block that declares the local variable, so the value stored into it can never be read before the variable goes out of scope.

      ## Remediation
      Remove variables and assignments whose values are never used, or use them as intended.
    category: correctness
    cwe:
    - 'CWE-563: Assignment to Variable without Use'
    references:
    - https://cwe.mitre.org/data/definitions/563.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Remove variables and assignments whose values are never used, or use them as intended.
    policy_name: 'Unused Variable: Dead Store at End of Scope'
  patterns:
  - pattern-either:
    - patterns:
      - pattern-inside: |
          {
            ...
            $T $X;
            ...
            $X = $V;
          }
      - pattern: $X = $V;
      - pattern-not-inside: |
          $X = $V;
          $NEXT;
    - patterns:
      - pattern-inside: |
          {
            ...
            $T $X;
            ...
            $X = $V;
            ;
          }
      - pattern: |
          $X = $V;
          ;
      - pattern-not-inside: |
          $X = $V;
          ;
          $NEXT;
    - patterns:
      - pattern-inside: |
          {
            ...
            $T $X = $V;
          }
      - pattern: $T $X = $V;
      - pattern-not-inside: |
          $T $X = $V;
          $NEXT;
    - patterns:
      - pattern-inside: |
          {
            ...
            $T $X = $V;
            ;
          }
      - pattern: |
          $T $X = $V;
          ;
      - pattern-not-inside: |
          $T $X = $V;
          ;
          $NEXT;
  - metavariable-regex:
      metavariable: $V
      regex: ^(?!(?:0|-1|NULL|nullptr|0[xX]0+|0\.0*[fF]?|0[uUlL]+|-1[lL]*|'\\0'|L'\\0'|' '|L' '|\"\"|L\"\"|false|FALSE|INVALID_SOCKET|INVALID_HANDLE_VALUE|-1\.0*[fF]?)$)
  - pattern-not-inside: |
      $T2 &$REF = $X;
      ...
  - pattern-not-inside: |
      $T2 *$REF = &$X;
      ...
  - pattern-not: |
      $T $X($ARG1);
  - pattern-not: |
      $T $X($ARG1, ...);
  - pattern-not: |
      static $T $X = $V;
  - metavariable-regex:
      metavariable: $T
      regex: ^(?!.*[*&\[<])(?!.*\b(?:HANDLE|SOCKET|FILE)\b)[A-Za-z_][\w ]*$
  - pattern-not-inside: |
      $LBL:
        $X = $V;
  - pattern-not-inside: |
      $T $X;
      ...
      if ($CC) $SS;
  - pattern-not-inside: |
      $T $X;
      ...
      if ($CC) $SS; else $SS2;
  - pattern-not-inside: |
      $T $X;
      ...
      while ($CC) $SS;
  - pattern-not-inside: |
      $T $X;
      ...
      for (...) $SS;
  - pattern-not-inside: |
      $T $X;
      ...
      do $SS; while ($CC);
  - pattern-not-inside: |
      $T $X;
      ...
      switch ($CC) $SS;
  - pattern-not-inside: |
      $T $X;
      ...
      { ... }
