rules:
- id: cwe319-cleartext-credential-received-and-used
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A password is received from the network and passed to a logon call in the same function without being decrypted, so the credential travels in cleartext.
  metadata:
    vulnerability_class: Cleartext Transmission of Sensitive Information
    help: |
      ## Summary
      A password is received from the network and passed to a logon call in the same function without being decrypted, so the credential travels in cleartext.

      ## Remediation
      Encrypt sensitive data in transit with TLS instead of sending it over plain sockets.
    category: security
    cwe:
    - 'CWE-319: Cleartext Transmission of Sensitive Information'
    references:
    - https://cwe.mitre.org/data/definitions/319.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Encrypt sensitive data in transit with TLS instead of sending it over plain sockets.
    policy_name: Cleartext Credential over Network (Same Function)
  patterns:
  - pattern-either:
    - pattern: $RECV($SOCK, $PW, ...)
    - pattern: $RECV($SOCK, ($CAST)($PW + $OFF), ...)
    - pattern: $RECV($SOCK, $PW + $OFF, ...)
  - metavariable-regex:
      metavariable: $RECV
      regex: ^(recv|recvfrom|read)$
  - pattern-either:
    - pattern-inside: |
        $T_F $F(...) {
          ...
          <... $LOGON($USER, $DOM, $PW, ...) ...>;
          ...
        }
    - pattern-inside: |
        $T_F $F(...) {
          ...
          $A = <... $PW ...>;
          ...
          <... $LOGON($USER, $DOM, $A, ...) ...>;
          ...
        }
    - pattern-inside: |
        $T_F $F(...) {
          ...
          $A = <... $PW ...>;
          ...
          $B = <... $A ...>;
          ...
          <... $LOGON($USER, $DOM, $B, ...) ...>;
          ...
        }
  - metavariable-regex:
      metavariable: $LOGON
      regex: ^(LogonUser|LogonUserA|LogonUserW|LogonUserExA|LogonUserExW)$
  - pattern-not-inside: |
      $T_F $F(...) {
        ...
        <... CryptDecrypt(...) ...>;
        ...
      }
  - pattern-not-inside: |
      $T_F $F(...) {
        ...
        <... BCryptDecrypt(...) ...>;
        ...
      }
  - pattern-not-inside: |
      $T_F $F(...) {
        ...
        <... CryptUnprotectData(...) ...>;
        ...
      }
  - pattern-not-inside: |
      $T_F $F(...) {
        ...
        <... EVP_DecryptUpdate(...) ...>;
        ...
      }
  - pattern-not-inside: |
      $T_F $F(...) {
        ...
        <... EVP_OpenUpdate(...) ...>;
        ...
      }
  - focus-metavariable: $RECV
