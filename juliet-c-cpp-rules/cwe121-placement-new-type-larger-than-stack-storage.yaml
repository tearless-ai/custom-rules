                ...
                $FPTR($A);
                ...
              }
          - metavariable-regex:
              metavariable: $AF
              regex: ^(alloca|_alloca|ALLOCA)$
        - patterns:
          - pattern-inside: |-
              $CR1 $SINK($PT $V) {
                ...
              }
              ...
              $CR2 $CALLER(...) {
                ...
                $FT (*$FPTR)(...) = $SINK;
                ...
                $A = ($T2 *)$AF(sizeof($C1));
                ...
