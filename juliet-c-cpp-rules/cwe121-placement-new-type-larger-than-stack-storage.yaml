rules:
- id: cwe121-placement-new-type-larger-than-stack-storage
  languages:
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: An object of type '$C2' is constructed with placement new in stack storage that was sized for '$C1'; writing its members can overflow the storage.
  metadata:
    vulnerability_class: Stack-based Buffer Overflow
    help: |
      ## Summary
      An object of type '`$C2`' is constructed with placement new in stack storage that was sized for '`$C1`'; writing its members can overflow the storage.

      ## Remediation
      Bound every copy and index by the destination's size (sizeof the array), use size-checked APIs such as snprintf, and validate lengths and indexes from input before use.
    category: security
    cwe:
    - 'CWE-121: Stack-based Buffer Overflow'
    references:
    - https://cwe.mitre.org/data/definitions/121.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Bound every copy and index by the destination's size (sizeof the array), use size-checked APIs such as snprintf, and validate lengths and indexes from input before use.
  patterns:
  - pattern-inside: |
      $C2 * $P = new($D2) $C2;
      ...
  - pattern: $P->$FLD = $VAL;
  - pattern-either:
    - pattern-either:
      - patterns:
        - pattern-either:
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $T $BUF[sizeof($C1)];
                ...
              }
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $T $BUF[sizeof($C1)] = $INIT;
                ...
              }
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $V = $BUF;
              ...
            }
      - patterns:
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $BUF = ($T2 *)$AF(sizeof($C1));
              ...
            }
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $V = $BUF;
              ...
            }
        - metavariable-regex:
            metavariable: $AF
            regex: ^(alloca|_alloca|ALLOCA)$
      - patterns:
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $V = ($T2 *)$AF(sizeof($C1));
              ...
            }
        - metavariable-regex:
            metavariable: $AF
            regex: ^(alloca|_alloca|ALLOCA)$
    - patterns:
      - pattern-either:
        - pattern-either:
          - pattern-inside: |-
              $CR1 $SINK($PT $V) {
                ...
              }
              ...
              $CR2 $CALLER(...) {
                ...
                $T $BUF[sizeof($C1)];
                ...
                $A = $BUF;
                ...
                $SINK($A);
                ...
              }
          - pattern-inside: |-
              $CR1 $SINK($PT $V) {
                ...
              }
              ...
              $CR2 $CALLER(...) {
                ...
                $T $BUF[sizeof($C1)] = $INIT;
                ...
                $A = $BUF;
                ...
                $SINK($A);
                ...
              }
        - patterns:
          - pattern-inside: |-
              $CR1 $SINK($PT $V) {
                ...
              }
              ...
              $CR2 $CALLER(...) {
                ...
                $BUF = ($T2 *)$AF(sizeof($C1));
                ...
                $A = $BUF;
                ...
                $SINK($A);
                ...
              }
          - metavariable-regex:
              metavariable: $AF
              regex: ^(alloca|_alloca|ALLOCA)$
        - patterns:
          - pattern-inside: |-
              $CR1 $SINK($PT $V) {
                ...
              }
              ...
              $CR2 $CALLER(...) {
                ...
                $A = ($T2 *)$AF(sizeof($C1));
                ...
                $SINK($A);
                ...
              }
          - metavariable-regex:
              metavariable: $AF
              regex: ^(alloca|_alloca|ALLOCA)$
      - pattern-inside: |-
          $CR1 $SINK($PT $V) {
            ...
          }
    - patterns:
      - pattern-either:
        - pattern-either:
          - pattern-inside: |-
              $CR1 $SINK($PT $V) {
                ...
              }
              ...
              $CR2 $CALLER(...) {
                ...
                $FT (*$FPTR)(...) = $SINK;
                ...
                $T $BUF[sizeof($C1)];
                ...
                $A = $BUF;
                ...
                $FPTR($A);
                ...
              }
          - pattern-inside: |-
              $CR1 $SINK($PT $V) {
                ...
              }
              ...
