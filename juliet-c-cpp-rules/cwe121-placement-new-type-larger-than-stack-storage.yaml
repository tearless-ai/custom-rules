      - pattern-inside: |-
          $CR1 $SINK() {
            ...
          }
    - patterns:
      - pattern-either:
        - pattern-either:
          - pattern-inside: |-
              $CR1 $SRCF(...) {
                ...
                $T $BUF[sizeof($C1)];
                ...
                $X = $BUF;
                ...
                return $X;
                ...
