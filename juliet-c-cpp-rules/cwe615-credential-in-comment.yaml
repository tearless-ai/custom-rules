rules:
- id: cwe615-credential-in-comment
  languages:
  - regex
  paths:
    include:
    - '*.c'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.h'
    - '*.hpp'
  severity: WARNING
  message: This comment appears to disclose a password or other credential value.
  metadata:
    vulnerability_class: Inclusion of Sensitive Information in Source Code Comments
    help: |
      ## Summary
      This comment appears to disclose a password or other credential value.

      ## Remediation
      Remove credentials and other sensitive information from source code comments.
    category: security
    cwe:
    - 'CWE-615: Inclusion of Sensitive Information in Source Code Comments'
    references:
    - https://cwe.mitre.org/data/definitions/615.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Remove credentials and other sensitive information from source code comments.
    policy_name: Credential Disclosed in Source Comment
  pattern-regex: (?i)(?:/\*|//)[^\n]*?\b(?:password|passwd|passphrase|pwd|secret|api[_ ]?key|token)\b\s*(?:is|=|:|was)?\s*["']?(?=[^\s"'*]*[0-9])(?=[^\s"'*]*[A-Za-z])[^\s"'*]{6,}[^\n]*
