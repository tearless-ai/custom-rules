rules:
- id: cwe256-password-from-file-used-without-decryption
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A password read from a file is passed to a logon call without being decrypted, which means it is stored in plaintext.
  metadata:
    vulnerability_class: Plaintext Storage of a Password
    help: |
      ## Summary
      A password read from a file is passed to a logon call without being decrypted, which means it is stored in plaintext.

      ## Remediation
      Store passwords only in encrypted or hashed form; decrypt with a protected key immediately before use.
    category: security
    cwe:
    - 'CWE-256: Plaintext Storage of a Password'
    references:
    - https://cwe.mitre.org/data/definitions/256.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Store passwords only in encrypted or hashed form; decrypt with a protected key immediately before use.
    policy_name: Plaintext Storage of Password Read from File
  options:
    constant_propagation: false
  patterns:
  - pattern: $LOGON($U, $D, $PW, ...)
  - metavariable-regex:
      metavariable: $LOGON
      regex: ^(LogonUser|LogonUserA|LogonUserW|LogonUserExA|LogonUserExW)$
  - pattern-either:
    - pattern-inside: |
        $T $FN(...) {
          ...
          if (<... fgets($X, $N, $FP) ...>) { ... }
          ...
        }
    - pattern-inside: |
        $T $FN(...) {
          ...
          fgets($X, $N, $FP);
          ...
        }
    - pattern-inside: |
        $T $FN(...) {
          ...
          if (<... fgetws($X, $N, $FP) ...>) { ... }
          ...
        }
    - pattern-inside: |
        $T $FN(...) {
          ...
          fgetws($X, $N, $FP);
          ...
        }
    - pattern-inside: |
        $T $FN(...) {
          ...
          if (<... fread($X, $SZ, $N, $FP) ...>) { ... }
          ...
        }
    - pattern-inside: |
        $T $FN(...) {
          ...
          fread($X, $SZ, $N, $FP);
          ...
        }
    - pattern-inside: |
        $T $FN(...) {
          ...
          if (<... ReadFile($FP, $X, ...) ...>) { ... }
          ...
        }
    - pattern-inside: |
        $T $FN(...) {
          ...
          ReadFile($FP, $X, ...);
          ...
        }
  - metavariable-pattern:
      metavariable: $FP
      patterns:
      - pattern-not: stdin
  - metavariable-comparison:
      comparison: str($X) == str($PW)
  - pattern-not-inside: |
      $T $FN(...) {
        ...
        if (<... CryptDecrypt(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |
      $T $FN(...) {
        ...
        CryptDecrypt(...);
        ...
      }
  - pattern-not-inside: |
      $T $FN(...) {
        ...
        if (<... CryptUnprotectData(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |
      $T $FN(...) {
        ...
        CryptUnprotectData(...);
        ...
      }
  - pattern-not-inside: |
      $T $FN(...) {
        ...
        if (<... BCryptDecrypt(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |
      $T $FN(...) {
        ...
        BCryptDecrypt(...);
        ...
      }
  - pattern-not-inside: |
      $T $FN(...) {
        ...
        if (<... EVP_DecryptFinal_ex(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |
      $T $FN(...) {
        ...
        EVP_DecryptFinal_ex(...);
        ...
      }
  - focus-metavariable: $LOGON
