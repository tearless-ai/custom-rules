        - pattern: UINT64_MAX
        - pattern: INTMAX_MAX
        - pattern: SIZE_MAX
    - pattern: $R $SINK(..., $T $D, ...) { ... }
    - focus-metavariable: $D
  - patterns:
    - pattern-inside: |
        $R $SINK(...) { ... }
        ...
        $R2 $CALLER(...) { ... $V = $E; ... $G = $V; ... }
    - metavariable-pattern:
        metavariable: $E
        pattern-either:
        - patterns:
          - pattern: <... $SRCFN(...) ...>
          - metavariable-regex:
              metavariable: $SRCFN
              regex: ^(rand|random|RAND32|RAND64|atoi|atol|atoll|_atoi64|strtol|strtoul|strtoll|strtoull|_wtoi|_wtol|_wtoi64|wcstol|wcstoul|wcstoll|wcstoull|atof|strtod|strtof|_wtof|wcstod)$
        - pattern: INT_MAX
        - pattern: UINT_MAX
        - pattern: SHRT_MAX
        - pattern: USHRT_MAX
        - pattern: CHAR_MAX
        - pattern: SCHAR_MAX
        - pattern: UCHAR_MAX
        - pattern: LONG_MAX
        - pattern: ULONG_MAX
        - pattern: LLONG_MAX
        - pattern: ULLONG_MAX
        - pattern: INT64_MAX
