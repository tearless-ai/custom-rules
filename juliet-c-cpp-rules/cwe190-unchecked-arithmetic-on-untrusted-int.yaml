        - pattern: UINT_MAX
        - pattern: SHRT_MAX
        - pattern: USHRT_MAX
        - pattern: CHAR_MAX
        - pattern: SCHAR_MAX
        - pattern: UCHAR_MAX
        - pattern: LONG_MAX
        - pattern: ULONG_MAX
        - pattern: LLONG_MAX
        - pattern: ULLONG_MAX
        - pattern: INT64_MAX
        - pattern: UINT64_MAX
        - pattern: INTMAX_MAX
        - pattern: SIZE_MAX
    - pattern-inside: $R2 $C::$M2(...) { ... }
    - pattern-not-inside: $LRT $LFN(...) { ... $LT $V; ... }
    - pattern-not-inside: $LRT $LFN(...) { ... $LT $V = $LI; ... }
    - pattern: $V
  - patterns:
    - pattern-inside: |
        $R $SINK(..., $T $D, ...) { ... }
        ...
        $R2 $CALLER(...) { ... fscanf($FF, $FMT, &$V); ... $SINK(..., $V, ...); ... }
    - pattern: $R $SINK(..., $T $D, ...) { ... }
    - focus-metavariable: $D
  - patterns:
    - pattern-inside: |
        $R2 $CALLER(...) { ... fscanf($FF, $FMT, &$V); ... $SINK(..., $V, ...); ... }
        ...
        $R $SINK(..., $T $D, ...) { ... }
    - pattern: $R $SINK(..., $T $D, ...) { ... }
    - focus-metavariable: $D
  - patterns:
