        - pattern: INT_MAX
        - pattern: UINT_MAX
        - pattern: SHRT_MAX
        - pattern: USHRT_MAX
        - pattern: CHAR_MAX
        - pattern: SCHAR_MAX
        - pattern: UCHAR_MAX
        - pattern: LONG_MAX
        - pattern: ULONG_MAX
        - pattern: LLONG_MAX
        - pattern: ULLONG_MAX
        - pattern: INT64_MAX
