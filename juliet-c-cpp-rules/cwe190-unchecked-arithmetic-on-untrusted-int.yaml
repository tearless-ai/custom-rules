rules:
- id: cwe190-unchecked-arithmetic-on-untrusted-int
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: An integer from an untrusted or unbounded source (input, socket, file, rand, or a type maximum) is incremented, added to, or multiplied without an upper-bound check, which can overflow.
  metadata:
    vulnerability_class: Integer Overflow or Wraparound
    help: |
      ## Summary
      An integer from an untrusted or unbounded source (input, socket, file, rand, or a type maximum) is incremented, added to, or multiplied without an upper-bound check, which can overflow.

      ## Remediation
      Check operands against the type's limits before arithmetic (e.g. if (x < INT_MAX) x + 1), or use checked-arithmetic builtins such as __builtin_add_overflow.
    category: security
    cwe:
    - 'CWE-190: Integer Overflow or Wraparound'
    references:
    - https://cwe.mitre.org/data/definitions/190.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Check operands against the type's limits before arithmetic (e.g. if (x < INT_MAX) x + 1), or use checked-arithmetic builtins such as __builtin_add_overflow.
  mode: taint
  options:
    constant_propagation: false
  pattern-sources:
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: fscanf($FF, $FMT, &$X)
      - pattern: scanf($FMT, &$X)
      - pattern: fwscanf($FF, $FMT, &$X)
      - pattern: wscanf($FMT, &$X)
    - focus-metavariable: $X
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: fgets($B, ...)
      - pattern: fgetws($B, ...)
      - pattern: recv($SOCK, $B, ...)
      - pattern: recvfrom($SOCK, $B, ...)
      - pattern: read($FD, $B, ...)
      - pattern: fread($B, ...)
    - focus-metavariable: $B
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $R = recv($SOCK, $B, ...);
          ...
      - pattern-inside: |
          $R = recvfrom($SOCK, $B, ...);
          ...
      - pattern-inside: |
          $R = read($SOCK, $B, ...);
          ...
      - pattern-inside: |
          $R = fgets($B, ...);
          ...
      - pattern-inside: |
          $R = fgetws($B, ...);
          ...
      - pattern-inside: if (fgets($B, ...) != NULL) { ... }
      - pattern-inside: if (fgetws($B, ...) != NULL) { ... }
    - pattern: $CONV($B, ...)
    - metavariable-regex:
        metavariable: $CONV
        regex: ^(atoi|atol|atoll|_atoi64|strtol|strtoul|strtoll|strtoull|_wtoi|_wtol|_wtoi64|wcstol|wcstoul|wcstoll|wcstoull|atof|strtod|strtof|_wtof|wcstod|sscanf|swscanf)$
  - pattern-either:
    - pattern: rand()
    - pattern: random()
    - pattern: RAND32()
    - pattern: RAND64()
    - pattern: INT_MAX
    - pattern: UINT_MAX
    - pattern: SHRT_MAX
    - pattern: USHRT_MAX
    - pattern: CHAR_MAX
    - pattern: SCHAR_MAX
    - pattern: UCHAR_MAX
    - pattern: LONG_MAX
    - pattern: ULONG_MAX
    - pattern: LLONG_MAX
    - pattern: ULLONG_MAX
    - pattern: INT64_MAX
    - pattern: UINT64_MAX
    - pattern: INTMAX_MAX
    - pattern: SIZE_MAX
  - patterns:
    - pattern-inside: |
        $R $SINK(..., $T $D, ...) { ... }
        ...
        $R2 $CALLER(...) { ... $V = $E; ... $SINK(..., $V, ...); ... }
    - metavariable-pattern:
        metavariable: $E
        pattern-either:
        - patterns:
          - pattern: <... $SRCFN(...) ...>
          - metavariable-regex:
              metavariable: $SRCFN
              regex: ^(rand|random|RAND32|RAND64|atoi|atol|atoll|_atoi64|strtol|strtoul|strtoll|strtoull|_wtoi|_wtol|_wtoi64|wcstol|wcstoul|wcstoll|wcstoull|atof|strtod|strtof|_wtof|wcstod)$
        - pattern: INT_MAX
        - pattern: UINT_MAX
        - pattern: SHRT_MAX
        - pattern: USHRT_MAX
        - pattern: CHAR_MAX
        - pattern: SCHAR_MAX
        - pattern: UCHAR_MAX
        - pattern: LONG_MAX
        - pattern: ULONG_MAX
        - pattern: LLONG_MAX
        - pattern: ULLONG_MAX
        - pattern: INT64_MAX
        - pattern: UINT64_MAX
        - pattern: INTMAX_MAX
        - pattern: SIZE_MAX
    - pattern: $R $SINK(..., $T $D, ...) { ... }
    - focus-metavariable: $D
