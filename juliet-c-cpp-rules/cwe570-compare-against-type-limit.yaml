rules:
- id: cwe570-compare-against-type-limit
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: Comparing a value against the limit of its own type like this is always false.
  metadata:
    vulnerability_class: Expression is Always False
    help: |
      ## Summary
      Comparing a value against the limit of its own type like this is always false.

      ## Remediation
      Fix conditions that are always false; they indicate a logic error or dead code.
    category: correctness
    cwe:
    - 'CWE-570: Expression is Always False'
    references:
    - https://cwe.mitre.org/data/definitions/570.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Fix conditions that are always false; they indicate a logic error or dead code.
  pattern-either:
  - pattern: (int $X) < INT_MIN
  - pattern: (int $X) > INT_MAX
  - pattern: (long $X) < LONG_MIN
  - pattern: (long $X) > LONG_MAX
