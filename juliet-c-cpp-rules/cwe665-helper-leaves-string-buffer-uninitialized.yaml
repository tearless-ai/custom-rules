rules:
- id: cwe665-helper-leaves-string-buffer-uninitialized
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: This function receives a caller's uninitialized character buffer and hands it back without initializing it, and the caller then uses it as a string.
  metadata:
    vulnerability_class: Improper Initialization
    help: |
      ## Summary
      This function receives a caller's uninitialized character buffer and hands it back without initializing it, and the caller then uses it as a string.

      ## Remediation
      Initialize objects and buffers fully (including string terminators) before use.
    category: security
    cwe:
    - 'CWE-665: Improper Initialization'
    references:
    - https://cwe.mitre.org/data/definitions/665.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Initialize objects and buffers fully (including string terminators) before use.
    policy_name: 'Improper Initialization: Helper Returns Uninitialized String Buffer'
  patterns:
  - pattern-either:
    - pattern-inside: |
        $RH $SRC(..., $PT $P, ...) { ... return $P; }
        ...
        $R $F(...) { ... $BT $BUF[$N]; ... $X = $BUF; ... $X = $SRC(..., $X, ...); ... $CAT($X, ...); ... }
    - pattern-inside: |
        $RH $SRC(..., $PT &$P, ...) { ... }
        ...
        $R $F(...) { ... $BT $BUF[$N]; ... $X = $BUF; ... $SRC($X); ... $CAT($X, ...); ... }
  - metavariable-regex:
      metavariable: $CAT
      regex: ^(strcat|strncat|wcscat|wcsncat|_mbscat|_mbsncat|lstrcat|lstrcatA|lstrcatW|StrCat|strlen|wcslen)$
  - pattern-not-inside: |
      $RH $SRC(..., $PT $P, ...) { ... $P[$I] = $V; ... }
      ...
  - pattern-not-inside: |
      $RH $SRC(..., $PT &$P, ...) { ... $P[$I] = $V; ... }
      ...
  - pattern-not-inside: |
      $RH $SRC(..., $PT $P, ...) { ... *$P = $V; ... }
      ...
  - pattern-not-inside: |
      $RH $SRC(..., $PT &$P, ...) { ... *$P = $V; ... }
      ...
  - pattern-not-inside: |
      $RH $SRC(..., $PT $P, ...) { ... $P = $V; ... }
      ...
  - pattern-not-inside: |
      $RH $SRC(..., $PT &$P, ...) { ... $P = $V; ... }
      ...
  - pattern-not-inside: |
      $RH $SRC(..., $PT $P, ...) { ... strcpy($P, ...); ... }
      ...
  - pattern-not-inside: |
      $RH $SRC(..., $PT &$P, ...) { ... strcpy($P, ...); ... }
      ...
  - pattern-not-inside: |
