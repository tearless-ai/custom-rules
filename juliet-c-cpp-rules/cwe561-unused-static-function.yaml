rules:
- id: cwe561-unused-static-function
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: This file-local (static) function is never called or referenced in its translation unit, so it is dead code.
  metadata:
    vulnerability_class: Dead Code
    help: |
      ## Summary
      This file-local (static) function is never called or referenced in its translation unit, so it is dead code.

      ## Remediation
      Remove dead code that can never execute.
    category: correctness
    cwe:
    - 'CWE-561: Dead Code'
    references:
    - https://cwe.mitre.org/data/definitions/561.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Remove dead code that can never execute.
    policy_name: 'Dead Code: Unused Static Function'
  patterns:
  - pattern: |
      static $R $F(...) { ... }
  - pattern-regex: (?m)^[ \t]*static\b[^;{}()]*\([^;{}]*\)\s*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*\}
  - pattern-not-inside: |
      static $R $F(...) { ... }
      ...
      $R2 $G(...) { ... <... $F ...>; ... }
  - pattern-not-inside: |
      static $R $F(...) { ... }
      ...
      $R2 $G(...) { ... if (<... $F ...>) $S; ... }
  - pattern-not-inside: |
      $R2 $G(...) { ... <... $F ...>; ... }
      ...
      static $R $F(...) { ... }
  - pattern-not-inside: |
      $T3 $V = <... $F ...>;
      ...
  - metavariable-regex:
      metavariable: $F
      regex: ^(?!main$|_)
  - focus-metavariable: $F
