rules:
- id: cwe535-password-in-error-output
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: The secret $P is written to the shell's error output, where it can be seen by users or captured
    in logs.
  metadata:
    vulnerability_class: Exposure of Information Through Shell Error Message
    help: |
      ## Summary
      The secret `$P` is written to the shell's error output, where it can be seen by users or captured in logs.

      ## Remediation
      Do not expose shell error output to users; handle and log errors internally.
    category: security
    cwe:
    - 'CWE-535: Exposure of Information Through Shell Error Message'
    references:
    - https://cwe.mitre.org/data/definitions/535.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Do not expose shell error output to users; handle and log errors internally.
  patterns:
  - pattern-either:
    - pattern: fprintf(stderr, $FMT, ..., $P, ...)
    - pattern: fwprintf(stderr, $FMT, ..., $P, ...)
    - pattern: fputs($P, stderr)
    - pattern: fputws($P, stderr)
    - pattern: perror($P)
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^.*(passw|passwd|pwd|passphrase|secret|privkey|private_key|credential)
