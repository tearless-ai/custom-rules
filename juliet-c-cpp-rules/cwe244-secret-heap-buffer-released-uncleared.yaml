rules:
- id: cwe244-secret-heap-buffer-released-uncleared
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: The heap buffer $P holds a secret but is released by $REL() without first being cleared, leaving the secret in freed heap memory.
  metadata:
    vulnerability_class: Improper Clearing of Heap Memory Before Release ('Heap Inspection')
    help: |
      ## Summary
      The heap buffer `$P` holds a secret but is released by `$REL()` without first being cleared, leaving the secret in freed heap memory.

      ## Remediation
      Clear sensitive heap buffers with SecureZeroMemory/explicit_bzero before free() or realloc(); do not realloc buffers that hold secrets.
    category: security
    cwe:
    - 'CWE-244: Improper Clearing of Heap Memory Before Release (''Heap Inspection'')'
    references:
    - https://cwe.mitre.org/data/definitions/244.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Clear sensitive heap buffers with SecureZeroMemory/explicit_bzero before free() or realloc(); do not realloc buffers that hold secrets.
  patterns:
  - pattern-either:
    - pattern: $REL($P)
    - pattern: $P = $REL($P, ...)
    - pattern: $P = ($T) $REL($P, ...)
    - pattern: $REL($P, ...)
  - metavariable-regex:
      metavariable: $REL
      regex: ^(free|realloc|_recalloc|HeapFree|HeapReAlloc|LocalFree|GlobalFree|LocalReAlloc|GlobalReAlloc|operator delete)$
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^.*(passw|passwd|pwd|passphrase|secret|privkey|private_key|credential)
  - pattern-not-inside: |
      SecureZeroMemory($P, ...);
      ...
  - pattern-not-inside: |
      RtlSecureZeroMemory($P, ...);
      ...
  - pattern-not-inside: |
      explicit_bzero($P, ...);
      ...
  - pattern-not-inside: |
      memset_s($P, ...);
      ...
  - pattern-not-inside: |
      memset($P, ...);
      ...
  - pattern-not-inside: |
      ZeroMemory($P, ...);
      ...
  - pattern-not-inside: |
      bzero($P, ...);
      ...
  - pattern-not-inside: |
      OPENSSL_cleanse($P, ...);
      ...
  - pattern-not-inside: |
      sodium_memzero($P, ...);
      ...
