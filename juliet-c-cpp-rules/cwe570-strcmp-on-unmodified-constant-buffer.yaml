rules:
- id: cwe570-strcmp-on-unmodified-constant-buffer
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: A character buffer initialized from a string literal and never modified is compared with another literal, so the result is always false.
  metadata:
    vulnerability_class: Expression is Always False
    help: |
      ## Summary
      A character buffer initialized from a string literal and never modified is compared with another literal, so the result is always false.

      ## Remediation
      Fix conditions that are always false; they indicate a logic error or dead code.
    category: correctness
    cwe:
    - 'CWE-570: Expression is Always False'
    references:
    - https://cwe.mitre.org/data/definitions/570.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Fix conditions that are always false; they indicate a logic error or dead code.
    policy_name: 'Expression Always False: Comparison of Unmodified Constant String'
  patterns:
  - pattern-either:
    - pattern-inside: |
        char $S[$N] = $A;
        ...
    - pattern-inside: |
        wchar_t $S[$N] = $A;
        ...
  - pattern-not-inside: |
      $F(..., $S, ...);
      ...
  - pattern-either:
    - pattern: strcmp($S, $B) == 0
    - pattern: wcscmp($S, $B) == 0
  - metavariable-regex:
      metavariable: $B
      regex: ^L?".*"$
  - metavariable-comparison:
      comparison: str($A) != str($B)
