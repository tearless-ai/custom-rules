rules:
- id: cwe121-narrow-strlen-sizes-wide-copy-into-stack-buffer
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: The length of '$SRC' is measured with strlen() on a char* cast, but the data is then copied with wcscpy(); the stack buffer sized from that length is too small for the wide string.
  metadata:
    vulnerability_class: Stack-based Buffer Overflow
    help: |
      ## Summary
      The length of '`$SRC`' is measured with strlen() on a char* cast, but the data is then copied with wcscpy(); the stack buffer sized from that length is too small for the wide string.

      ## Remediation
      Bound every copy and index by the destination's size (sizeof the array), use size-checked APIs such as snprintf, and validate lengths and indexes from input before use.
    category: security
    cwe:
    - 'CWE-121: Stack-based Buffer Overflow'
    references:
    - https://cwe.mitre.org/data/definitions/121.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Bound every copy and index by the destination's size (sizeof the array), use size-checked APIs such as snprintf, and validate lengths and indexes from input before use.
  patterns:
  - pattern-either:
    - pattern-inside: |
        $LT $LEN = strlen((char *)$SRC);
        ...
    - pattern-inside: |
        $LEN = strlen((char *)$SRC);
        ...
  - pattern-either:
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $DEST = ($T *)alloca(...);
          ...
        }
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $DEST = ($T *)_alloca(...);
          ...
        }
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $DEST = ($T *)ALLOCA(...);
          ...
        }
  - pattern: wcscpy($DEST, $SRC)
