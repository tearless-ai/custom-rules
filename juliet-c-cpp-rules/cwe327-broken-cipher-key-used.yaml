rules:
- id: cwe327-broken-cipher-key-used
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: Data is encrypted or decrypted with a key created for a broken or weak cipher (DES, 3DES, RC2, RC4 or RC5); use AES instead.
  metadata:
    vulnerability_class: Use of a Broken or Risky Cryptographic Algorithm
    help: |
      ## Summary
      Data is encrypted or decrypted with a key created for a broken or weak cipher (DES, 3DES, RC2, RC4 or RC5); use AES instead.

      ## Remediation
      Replace broken algorithms such as DES, 3DES, RC2 and RC4 with AES-GCM or another modern authenticated cipher.
    category: security
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    references:
    - https://cwe.mitre.org/data/definitions/327.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Replace broken algorithms such as DES, 3DES, RC2 and RC4 with AES-GCM or another modern authenticated cipher.
    policy_name: 'Broken Cryptographic Algorithm: Weak Cipher Key Used'
  patterns:
  - pattern: $CRYPT($KEY, ...)
  - metavariable-regex:
      metavariable: $CRYPT
      regex: ^(CryptEncrypt|CryptDecrypt)$
  - pattern-either:
    - pattern-inside: |
        $T $FN(...) {
          ...
          if (<... CryptDeriveKey($P, $ALG, $H, $F, &$KEY) ...>) { ... }
          ...
        }
    - pattern-inside: |
        $T $FN(...) {
          ...
          CryptDeriveKey($P, $ALG, $H, $F, &$KEY);
          ...
        }
    - pattern-inside: |
        $T $FN(...) {
          ...
          if (<... CryptGenKey($P, $ALG, $F, &$KEY) ...>) { ... }
          ...
        }
    - pattern-inside: |
        $T $FN(...) {
          ...
          CryptGenKey($P, $ALG, $F, &$KEY);
          ...
        }
  - metavariable-regex:
      metavariable: $ALG
      regex: ^(CALG_DES|CALG_3DES|CALG_3DES_112|CALG_DESX|CALG_RC2|CALG_RC4|CALG_RC5|CALG_CYLINK_MEK|CALG_SKIPJACK)$
