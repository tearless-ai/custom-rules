rules:
- id: cwe398-statement-without-effect
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: This expression statement computes a value that is discarded and has no side effect, so it
    does nothing.
  metadata:
    vulnerability_class: 7PK - Code Quality
    help: |
      ## Summary
      This expression statement computes a value that is discarded and has no side effect, so it does nothing.

      ## Remediation
      Remove empty blocks and statements with no effect, or implement the intended logic.
    category: correctness
    cwe:
    - 'CWE-398: 7PK - Code Quality'
    references:
    - https://cwe.mitre.org/data/definitions/398.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Remove empty blocks and statements with no effect, or implement the intended logic.
  patterns:
  - pattern: |
      $E;
      ...
  - metavariable-regex:
      metavariable: $E
      regex: ^(?!.*(\+\+|--))(?!.*[^=!<>]=[^=])[^(){};,]*[-+*/%<>&|^!~][^(){};,]*;?$|^(-?[0-9][0-9a-fA-FxX.uUlL]*|'[^']*'|"[^"]*"|L'[^']*'|L"[^"]*");?$
  - focus-metavariable: $E
