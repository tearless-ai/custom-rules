rules:
- id: cwe121-source-array-larger-than-stack-destination
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: The source array '$SRC' can hold more elements than the stack destination '$DST', and this
    copy is bounded only by the source length, so it can overflow the destination.
  metadata:
    vulnerability_class: Stack-based Buffer Overflow
    help: |
      ## Summary
      The source array '`$SRC`' can hold more elements than the stack destination '`$DST`', and this copy is bounded only by the source length, so it can overflow the destination.

      ## Remediation
      Bound every copy and index by the destination's size (sizeof the array), use size-checked APIs such as snprintf, and validate lengths and indexes from input before use.
    category: security
    cwe:
    - 'CWE-121: Stack-based Buffer Overflow'
    references:
    - https://cwe.mitre.org/data/definitions/121.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Bound every copy and index by the destination's size (sizeof the array), use size-checked
      APIs such as snprintf, and validate lengths and indexes from input before use.
  patterns:
  - pattern-either:
    - pattern: strcpy($DST, $SRC)
    - pattern: wcscpy($DST, $SRC)
    - pattern: strcat($DST, $SRC)
    - pattern: wcscat($DST, $SRC)
    - pattern: memcpy($DST, $SRC, (strlen($SRC) + 1) * sizeof(...))
    - pattern: memmove($DST, $SRC, (strlen($SRC) + 1) * sizeof(...))
    - pattern: memcpy($DST, $SRC, (wcslen($SRC) + 1) * sizeof(...))
    - pattern: memmove($DST, $SRC, (wcslen($SRC) + 1) * sizeof(...))
    - pattern: strncpy($DST, $SRC, strlen($SRC) + 1)
    - pattern: wcsncpy($DST, $SRC, wcslen($SRC) + 1)
    - patterns:
      - pattern-inside: for ($I = $Z; $I < $BOUND; $I++) { ... }
      - pattern: $DST[$I] = $SRC[$I];
      - metavariable-regex:
          metavariable: $BOUND
          regex: '[A-Za-z_]'
  - pattern-either:
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $T3 $SRC[$M];
          ...
        }
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $T3 $SRC[$M] = $INIT;
          ...
        }
  - pattern-either:
    - pattern-either:
      - patterns:
        - pattern-either:
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $T $BUF[$N];
                ...
              }
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $T $BUF[$N] = $INIT;
                ...
              }
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $V = $BUF;
              ...
            }
      - pattern-either:
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $T $V[$N];
              ...
            }
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $T $V[$N] = $INIT;
              ...
            }
      - patterns:
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $BUF = ($T2 *)$AF($N * sizeof(...));
              ...
            }
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $V = $BUF;
              ...
            }
        - metavariable-regex:
            metavariable: $AF
            regex: ^(alloca|_alloca|ALLOCA)$
      - patterns:
