rules:
- id: cwe126-constant-index-past-array-end
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: An array is read at an index that is set to a constant greater than or equal to the array length and is not checked against the upper bound.
  metadata:
    vulnerability_class: Buffer Over-read
    help: |
      ## Summary
      An array is read at an index that is set to a constant greater than or equal to the array length and is not checked against the upper bound.

      ## Remediation
      Bound reads by the source buffer's real size, ensure strings are NUL-terminated after strncpy/memcpy, and validate indexes against the buffer length.
    category: security
    cwe:
    - 'CWE-126: Buffer Over-read'
    references:
    - https://cwe.mitre.org/data/definitions/126.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Bound reads by the source buffer's real size, ensure strings are NUL-terminated after strncpy/memcpy, and validate indexes against the buffer length.
    policy_name: 'Buffer Over-read: Constant Index Past Array End'
  mode: taint
  options:
    taint_unify_mvars: true
  pattern-sources:
  - patterns:
    - pattern-inside: |
        $RT $F(...) { ... $P = $E; ... }
    - metavariable-regex:
        metavariable: $E
        regex: ^[0-9]+$
    - pattern-either:
      - pattern: $P
      - patterns:
        - pattern-inside: |
            $RT $F(...) { ... *$Q1 = $P; ... }
        - pattern-inside: |
            $RT $F(...) { ... $T1 $Q1 = &$V; ... }
        - pattern-inside: |
            $RT $F(...) { ... $T2 $Q2 = &$V; ... }
        - pattern: '*$Q2'
  pattern-propagators:
  - pattern: $U.$FLD = $X
    from: $X
    to: $U
  pattern-sinks:
  - patterns:
    - pattern-inside: |
        $RT $F(...) { ... $X = $E; ... }
    - pattern-either:
      - pattern-inside: |
          $BT $BUF[$SZ] = $INIT;
          ...
      - pattern-inside: |
          $BT $BUF[$SZ];
          ...
    - pattern: $BUF[$IDX]
    - pattern-not-inside: $BUF[$IDX] = $W
    - metavariable-regex:
        metavariable: $IDX
        regex: ^[A-Za-z_]\w*$
    - metavariable-comparison:
        comparison: int($E) >= int($SZ)
    - pattern-not-inside: if (<... $IDX < $HI ...>) { ... }
    - pattern-not-inside: if (<... $IDX <= $HI ...>) { ... }
    - pattern-not-inside: if (<... $HI > $IDX ...>) { ... }
    - pattern-not-inside: if (<... $HI >= $IDX ...>) { ... }
    - pattern-not-inside: if (<... $IDX < $HI ...>) { ... } else { ... }
    - pattern-not-inside: if (<... $IDX <= $HI ...>) { ... } else { ... }
    - pattern-not-inside: if (<... $HI > $IDX ...>) { ... } else { ... }
    - pattern-not-inside: if (<... $HI >= $IDX ...>) { ... } else { ... }
    - focus-metavariable: $IDX
