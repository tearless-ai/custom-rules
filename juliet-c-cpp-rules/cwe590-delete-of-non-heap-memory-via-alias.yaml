rules:
- id: cwe590-delete-of-non-heap-memory-via-alias
  languages:
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A pointer to stack, static or alloca() memory is released with free(), delete or delete[]; only memory obtained from the matching heap allocator may be released. The pointer reaches the release through a pointer, reference or union alias.
  metadata:
    vulnerability_class: Free of Memory not on the Heap
    help: |
      ## Summary
      A pointer to stack, static or alloca() memory is released with free(), delete or delete[]; only memory obtained from the matching heap allocator may be released. The pointer reaches the release through a pointer, reference or union alias.

      ## Remediation
      Only free memory that was allocated on the heap; never free stack arrays, static data or string literals.
    category: security
    cwe:
    - 'CWE-590: Free of Memory not on the Heap'
    references:
    - https://cwe.mitre.org/data/definitions/590.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Only free memory that was allocated on the heap; never free stack arrays, static data or string literals.
  pattern-either:
  - patterns:
    - pattern-inside: |
        $RT $FN(...) {
          ...
          $PT1 $P1 = &$V;
          ...
          $PT2 $P2 = &$V;
          ...
          $TB $B[$N];
          ...
          $X = $B;
          ...
          *$P1 = $X;
          ...
          $TY $Y = *$P2;
          ...
        }
    - pattern-either:
      - pattern: delete $Y;
      - pattern: delete [] $Y;
  - patterns:
    - pattern-inside: |
        $RT $FN(...) {
          ...
          $PT1 $P1 = &$V;
          ...
          $PT2 $P2 = &$V;
          ...
          $TB $B;
          ...
          $X = &$B;
          ...
          *$P1 = $X;
          ...
          $TY $Y = *$P2;
          ...
        }
    - pattern-either:
      - pattern: delete $Y;
      - pattern: delete [] $Y;
    - metavariable-regex:
        metavariable: $TB
        regex: ^[^*&]*$
  - patterns:
    - pattern-inside: |
        $RT $FN(...) {
          ...
          $PT1 $P1 = &$V;
          ...
          $PT2 $P2 = &$V;
          ...
          $TD $B = $SRC;
          ...
          $X = $B;
          ...
          *$P1 = $X;
          ...
          $TY $Y = *$P2;
          ...
        }
    - pattern-either:
      - pattern: delete $Y;
      - pattern: delete [] $Y;
    - metavariable-pattern:
        metavariable: $SRC
        pattern-either:
        - patterns:
          - pattern-either:
            - pattern: $AF(...)
            - pattern: ($ACT) $AF(...)
          - metavariable-regex:
              metavariable: $AF
              regex: ^(alloca|_alloca|ALLOCA|__builtin_alloca)$
        - pattern: new ($BUF) $PNT
