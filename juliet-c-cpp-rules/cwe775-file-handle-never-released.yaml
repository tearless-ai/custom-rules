    - patterns:
      - pattern-inside: |
          $RR $READER(...) { ... }
          ...
          $WR $WRITER(...) { ... $D = $ACQ(...); ... $GV = $D; ... }
      - metavariable-regex:
          metavariable: $ACQ
          regex: ^(fopen|_wfopen|fdopen|_fdopen|open|_open|OPEN|_wopen|creat|_creat|CreateFile|CreateFileA|CreateFileW)$
      - pattern: |
          $T $X = $GV;
      - pattern-not-inside: |
          $T $X = $GV;
          ...
          $USE(..., $X, ...);
      - pattern-not-inside: |
          $T $X = $GV;
          ...
