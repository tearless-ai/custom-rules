          ...
          $S.$FLD = $X;
      - pattern-not-inside: |
          $X = $HELPER(...);
          ...
          $S->$FLD = $X;
      - pattern-not-inside: |
          $X = $HELPER(...);
          ...
          $ARR[$I] = $X;
    - patterns:
      - pattern-inside: |
          $HR $HELPER(..., $HT &$HX, ...) { ... $HX = $ACQ(...); ... }
          ...
      - metavariable-regex:
          metavariable: $ACQ
          regex: ^(fopen|_wfopen|fdopen|_fdopen|open|_open|OPEN|_wopen|creat|_creat|CreateFile|CreateFileA|CreateFileW)$
      - pattern: |
          $HELPER($X);
      - pattern-not-inside: |
          $HELPER($X);
          ...
          $USE(..., $X, ...);
      - pattern-not-inside: |
          $HELPER($X);
          ...
          $USE(..., ($CT)$X, ...);
      - pattern-not-inside: |
