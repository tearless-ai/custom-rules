rules:
- id: cwe259-hardcoded-password-assigned
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: The password variable $P is initialized with a hard-coded string literal.
  metadata:
    vulnerability_class: Use of Hard-coded Password
    help: |
      ## Summary
      The password variable `$P` is initialized with a hard-coded string literal.

      ## Remediation
      Remove hard-coded passwords; load credentials from a protected store or prompt for them at run time.
    category: security
    cwe:
    - 'CWE-259: Use of Hard-coded Password'
    references:
    - https://cwe.mitre.org/data/definitions/259.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Remove hard-coded passwords; load credentials from a protected store or prompt for them
      at run time.
  options:
    constant_propagation: false
  patterns:
  - pattern-either:
    - pattern: $P = $LIT;
    - pattern: $T $P = $LIT;
    - pattern: $T $P[$SZ] = $LIT;
    - pattern: $T $P[] = $LIT;
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^.*(passw|passwd|pwd|passphrase)
  - metavariable-regex:
      metavariable: $LIT
      regex: ^L?"[^"]+"$
