rules:
- id: cwe122-heap-string-unbounded-copy-exceeds-fixed-destination
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A heap string filled to a length that does not fit a fixed-size array is copied or appended into that array without a size limit, overflowing it.
  metadata:
    vulnerability_class: Heap-based Buffer Overflow
    help: |
      ## Summary
      A heap string filled to a length that does not fit a fixed-size array is copied or appended into that array without a size limit, overflowing it.

      ## Remediation
      Allocate enough room for the data including the terminator, bound every copy and index by the allocation size, and validate lengths and indexes from input before use.
    category: security
    cwe:
    - 'CWE-122: Heap-based Buffer Overflow'
    references:
    - https://cwe.mitre.org/data/definitions/122.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Allocate enough room for the data including the terminator, bound every copy and index by the allocation size, and validate lengths and indexes from input before use.
    policy_name: 'Heap Buffer Overflow: Long Heap String Copied Without Limit'
  patterns:
  - pattern-either:
    - pattern: strcpy($DST, $SRC)
    - pattern: wcscpy($DST, $SRC)
    - pattern: strcat($DST, $SRC)
    - pattern: wcscat($DST, $SRC)
    - pattern: strncat($DST, $SRC, strlen($SRC))
    - pattern: wcsncat($DST, $SRC, wcslen($SRC))
  - pattern-either:
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $TD $DST[$N];
          ...
        }
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $TD $DST[$N] = $INIT;
          ...
        }
  - pattern-either:
    - patterns:
      - pattern-either:
        - patterns:
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $V = ($T5 *)$HF(...);
                ...
              }
          - metavariable-regex:
              metavariable: $HF
              regex: ^(malloc|calloc|realloc)$
        - pattern-either:
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $V = new $T4[$K];
                ...
              }
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $V = new $T4[$K] = $INIT;
                ...
              }
      - patterns:
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $MS($V1, $C, $L);
              ...
            }
        - metavariable-regex:
            metavariable: $MS
            regex: ^w?memset$
      - metavariable-comparison:
          comparison: str($V1) == str($V)
    - patterns:
      - pattern-either:
        - patterns:
          - pattern-inside: |-
              $CR1 $SINK($PT $V) {
                ...
              }
              ...
              $CR2 $CALLER(...) {
                ...
                $A = ($T5 *)$HF(...);
                ...
                $MS($A, $C, $L);
                ...
                $SINK($A);
                ...
              }
          - metavariable-regex:
              metavariable: $HF
              regex: ^(malloc|calloc|realloc)$
          - metavariable-regex:
              metavariable: $MS
              regex: ^w?memset$
        - patterns:
          - pattern-either:
            - pattern-inside: |-
                $CR1 $SINK($PT $V) {
                  ...
                }
                ...
                $CR2 $CALLER(...) {
                  ...
                  $A = new $T4[$K];
                  ...
                  $MS($A, $C, $L);
                  ...
                  $SINK($A);
                  ...
                }
            - pattern-inside: |-
                $CR1 $SINK($PT $V) {
                  ...
                }
                ...
                $CR2 $CALLER(...) {
                  ...
                  $A = new $T4[$K] = $INIT;
                  ...
                  $MS($A, $C, $L);
                  ...
                  $SINK($A);
                  ...
                }
          - metavariable-regex:
              metavariable: $MS
              regex: ^w?memset$
      - pattern-inside: |-
          $CR1 $SINK($PT $V) {
            ...
          }
    - patterns:
      - pattern-either:
        - patterns:
          - pattern-inside: |-
              $CR1 $SINK($PT $V) {
                ...
              }
              ...
              $CR2 $CALLER(...) {
                ...
                $FT (*$FPTR)(...) = $SINK;
                ...
                $A = ($T5 *)$HF(...);
                ...
                $MS($A, $C, $L);
                ...
                $FPTR($A);
