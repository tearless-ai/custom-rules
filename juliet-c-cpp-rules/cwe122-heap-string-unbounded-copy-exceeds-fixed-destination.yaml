                  ...
                }
          - metavariable-regex:
              metavariable: $MS
              regex: ^w?memset$
      - pattern-inside: |-
          $CR1 $SINK($PT $V) {
            ...
          }
    - patterns:
      - pattern-either:
        - patterns:
          - pattern-inside: |-
              $CR1 $SINK() {
