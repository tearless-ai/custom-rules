rules:
- id: cwe259-hardcoded-password-copied
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A hard-coded constant is copied into a password buffer; passwords must come from a protected external source, not the program text.
  metadata:
    vulnerability_class: Use of Hard-coded Password
    help: |
      ## Summary
      A hard-coded constant is copied into a password buffer; passwords must come from a protected external source, not the program text.

      ## Remediation
      Remove hard-coded passwords; load credentials from a protected store or prompt for them at run time.
    category: security
    cwe:
    - 'CWE-259: Use of Hard-coded Password'
    references:
    - https://cwe.mitre.org/data/definitions/259.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Remove hard-coded passwords; load credentials from a protected store or prompt for them at run time.
    policy_name: 'Hard-coded Password: Constant Copied into Password Buffer'
  options:
    constant_propagation: false
  patterns:
  - pattern-either:
    - pattern: $CPY($P, $LIT)
    - pattern: $CPY($P, $LIT, $N)
    - pattern: $CPY($P, $N, $LIT)
  - metavariable-regex:
      metavariable: $CPY
      regex: ^(strcpy|wcscpy|_tcscpy|_mbscpy|strncpy|wcsncpy|lstrcpyA|lstrcpyW|lstrcpy|StringCchCopyA|StringCchCopyW|StringCbCopyA|StringCbCopyW|strcpy_s|wcscpy_s|memcpy)$
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^.*(passw|passwd|pwd|passphrase)
  - metavariable-regex:
      metavariable: $LIT
      regex: ^(L?"[^"]+"|[A-Z][A-Z0-9_]*)$
  - pattern-not-inside: |
      SecureZeroMemory($P, ...);
      ...
  - pattern-not-inside: |
      RtlSecureZeroMemory($P, ...);
      ...
  - pattern-not-inside: |
      memset($P, ...);
      ...
  - pattern-not-inside: |
      ZeroMemory($P, ...);
      ...
  - pattern-not-inside: |
      explicit_bzero($P, ...);
      ...
  - pattern-not-inside: |
      memset_s($P, ...);
      ...
  - pattern-not-inside: |
      $P = realloc($P, ...);
      ...
