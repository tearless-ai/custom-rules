rules:
- id: cwe606-untrusted-loop-bound
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A loop bound parsed from untrusted input (console, file, socket, or environment) is used without an upper-bound check.
  metadata:
    vulnerability_class: Unchecked Input for Loop Condition
    help: |
      ## Summary
      A loop bound parsed from untrusted input (console, file, socket, or environment) is used without an upper-bound check.

      ## Remediation
      Validate loop bounds taken from external input against a maximum before looping.
    category: security
    cwe:
    - 'CWE-606: Unchecked Input for Loop Condition'
    references:
    - https://cwe.mitre.org/data/definitions/606.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Validate loop bounds taken from external input against a maximum before looping.
    policy_name: Unchecked Loop Condition from Untrusted Input
  mode: taint
  options:
    constant_propagation: false
  pattern-sources:
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: fgets($B, ...)
      - pattern: fgetws($B, ...)
      - pattern: recv($SOCK, $B, ...)
      - pattern: recvfrom($SOCK, $B, ...)
      - pattern: read($FD, $B, ...)
      - pattern: fread($B, ...)
      - pattern: fgets($B + $O, ...)
      - pattern: fgetws($B + $O, ...)
      - pattern: recv($SOCK, $B + $O, ...)
      - pattern: recvfrom($SOCK, $B + $O, ...)
      - pattern: read($FD, $B + $O, ...)
      - pattern: fread($B + $O, ...)
      - pattern: fgets(($BT)($B + $O), ...)
      - pattern: fgetws(($BT)($B + $O), ...)
      - pattern: recv($SOCK, ($BT)($B + $O), ...)
      - pattern: recvfrom($SOCK, ($BT)($B + $O), ...)
      - pattern: read($FD, ($BT)($B + $O), ...)
      - pattern: fread(($BT)($B + $O), ...)
    - focus-metavariable: $B
  - patterns:
    - pattern: $GE(...)
    - metavariable-regex:
        metavariable: $GE
        regex: ^(getenv|_wgetenv|GETENV|secure_getenv)$
  - by-side-effect: true
    patterns:
    - pattern-inside: |
        $ET $ENV = $GE(...);
        ...
    - metavariable-regex:
        metavariable: $GE
        regex: ^(getenv|_wgetenv|GETENV|secure_getenv)$
    - pattern-either:
      - pattern: strcat($B, $ENV, ...)
      - pattern: strcat($B + $O, $ENV, ...)
      - pattern: strncat($B, $ENV, ...)
      - pattern: strncat($B + $O, $ENV, ...)
      - pattern: wcscat($B, $ENV, ...)
      - pattern: wcscat($B + $O, $ENV, ...)
      - pattern: wcsncat($B, $ENV, ...)
      - pattern: wcsncat($B + $O, $ENV, ...)
      - pattern: strcpy($B, $ENV, ...)
      - pattern: strcpy($B + $O, $ENV, ...)
      - pattern: strncpy($B, $ENV, ...)
      - pattern: strncpy($B + $O, $ENV, ...)
      - pattern: wcscpy($B, $ENV, ...)
      - pattern: wcscpy($B + $O, $ENV, ...)
      - pattern: wcsncpy($B, $ENV, ...)
      - pattern: wcsncpy($B + $O, $ENV, ...)
      - pattern: memcpy($B, $ENV, ...)
      - pattern: memcpy($B + $O, $ENV, ...)
      - pattern: memmove($B, $ENV, ...)
      - pattern: memmove($B + $O, $ENV, ...)
    - focus-metavariable: $B
  - patterns:
    - pattern-inside: |
        $R $SINK(..., $T $D, ...) { ... }
        ...
        $R2 $CALLER(...) { ... if (<... fgets(<... $V ...>, ...) ...>) { ... } ... $SINK(..., $V, ...); ... }
    - pattern: $R $SINK(..., $T $D, ...) { ... }
    - focus-metavariable: $D
  - patterns:
    - pattern-inside: |
        $R2 $CALLER(...) { ... if (<... fgets(<... $V ...>, ...) ...>) { ... } ... $SINK(..., $V, ...); ... }
        ...
        $R $SINK(..., $T $D, ...) { ... }
    - pattern: $R $SINK(..., $T $D, ...) { ... }
    - focus-metavariable: $D
  - patterns:
    - pattern-inside: |
        $R $SINK(..., $T $D, ...) { ... }
        ...
        $R2 $CALLER(...) { ... $FT (*$FP)(...) = $SINK; ... if (<... fgets(<... $V ...>, ...) ...>) { ... } ... $FP(..., $V, ...); ... }
    - pattern: $R $SINK(..., $T $D, ...) { ... }
    - focus-metavariable: $D
  - patterns:
    - pattern-inside: |
        $R $SINK(..., $T $D, ...) { ... }
