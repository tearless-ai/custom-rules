        ...
    - pattern: $SRCF(..., $A, ...)
    - focus-metavariable: $A
  - patterns:
    - pattern-inside: $R $F(...) { ... $T &$REF = $V; ... if (<... fgets(<... $V ...>, ...) ...>) { ... } ... }
    - pattern: $REF
  - patterns:
    - pattern-inside: $R $F(...) { ... $T *$P2 = &$D; ... }
    - pattern-inside: $R $F(...) { ... $T *$P1 = &$D; ... if (<... fgets(<... $V ...>, ...) ...>) { ... } ... *$P1 = $V; ... }
    - metavariable-comparison:
        comparison: str($P1) != str($P2)
    - pattern: '*$P2'
  - patterns:
