    - pattern-inside: $R $F(...) { ... $T *$P1 = &$D; ... $ET $ENV = $GE(...); ... $CAT(<... $V ...>, $ENV, ...); ... *$P1 = $V; ... }
    - metavariable-regex:
        metavariable: $GE
        regex: ^(getenv|_wgetenv|GETENV|secure_getenv)$
    - metavariable-comparison:
        comparison: str($P1) != str($P2)
    - pattern: '*$P2'
  - patterns:
    - pattern-inside: |
        $R $C::$M1(...) { ... $ET $ENV = $GE(...); ... $CAT(<... $V ...>, $ENV, ...); ... }
        ...
        $R2 $C::$M2(...) { ... }
    - metavariable-regex:
        metavariable: $GE
        regex: ^(getenv|_wgetenv|GETENV|secure_getenv)$
    - pattern-inside: $R2 $C::$M2(...) { ... }
    - pattern-not-inside: $LRT $LFN(...) { ... $LT $V; ... }
    - pattern-not-inside: $LRT $LFN(...) { ... $LT $V = $LI; ... }
    - pattern: $V
  pattern-propagators:
  - pattern: $U.$FLD = $X
    from: $X
    to: $U
  - pattern: $B[$I] = $V
    from: $B
    to: $B
  - patterns:
    - pattern-inside: if (<... sscanf($S, $FMT, &$X) ...>) { ... }
    - pattern: $X
    from: $S
    to: $X
  - patterns:
    - pattern-inside: if (<... swscanf($S, $FMT, &$X) ...>) { ... }
    - pattern: $X
    from: $S
    to: $X
  - patterns:
    - pattern-inside: |
        sscanf($S, $FMT, &$X);
        ...
    - pattern: $X
    from: $S
    to: $X
  - patterns:
    - pattern-inside: |
        swscanf($S, $FMT, &$X);
        ...
    - pattern: $X
    from: $S
    to: $X
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern-inside: if (<... $X < $LIM ...>) { ... }
      - pattern-inside: if (<... $X <= $LIM ...>) { ... }
      - pattern-inside: if (<... $LIM > $X ...>) { ... }
      - pattern-inside: if (<... $LIM >= $X ...>) { ... }
      - pattern-inside: if (<... $ABS(<... $X ...>) < $LIM ...>) { ... }
      - pattern-inside: if (<... $ABS(<... $X ...>) <= $LIM ...>) { ... }
    - pattern: $X
  - pattern-either:
    - pattern: strlen(...)
    - pattern: wcslen(...)
    - pattern: strnlen(...)
    - pattern: wcsnlen(...)
    - pattern: sizeof($SZ)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: for ($I1; <... $X ...>; $I3) { ... }
      - pattern: for (; <... $X ...>; $I3) { ... }
      - pattern: for ($I1; <... $X ...>; ) { ... }
      - pattern: while (<... $X ...>) { ... }
    - focus-metavariable: $X
