rules:
- id: cwe563-overwritten-before-read
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: A meaningful value stored in a local variable is overwritten here before it was ever read, so the earlier assignment is dead.
  metadata:
    vulnerability_class: Assignment to Variable without Use
    help: |
      ## Summary
      A meaningful value stored in a local variable is overwritten here before it was ever read, so the earlier assignment is dead.

      ## Remediation
      Remove variables and assignments whose values are never used, or use them as intended.
    category: correctness
    cwe:
    - 'CWE-563: Assignment to Variable without Use'
    references:
    - https://cwe.mitre.org/data/definitions/563.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Remove variables and assignments whose values are never used, or use them as intended.
    policy_name: 'Unused Variable: Value Overwritten Before Use'
  patterns:
  - pattern-inside: |
      $R $FN(...) {
        ...
        $T $X;
        ...
      }
  - pattern-not-inside: |
      $T2 &$REF = $X;
      ...
  - pattern-not-inside: |
      $T2 *$REF = &$X;
      ...
  - pattern-either:
    - patterns:
      - pattern: |
          $S1;
          ...
          $X = $B;
      - metavariable-pattern:
          metavariable: $S1
          patterns:
          - pattern: $X = $A
          - metavariable-regex:
              metavariable: $A
              regex: ^(?!(?:0|-1|NULL|nullptr|0[xX]0+|0\.0*[fF]?|0[uUlL]+|-1[lL]*|'\\0'|L'\\0'|' '|L' '|\"\"|L\"\"|false|FALSE|INVALID_SOCKET|INVALID_HANDLE_VALUE|-1\.0*[fF]?)$)
          - pattern-not-inside: |
              $X = $A;
              ...
              $F(..., <... $X ...>, ...);
          - pattern-not-inside: |
              $X = $A;
              ...
              $X(...);
          - pattern-not-inside: |
              $X = $A;
              ...
              $Y = <... $X ...>;
          - pattern-not-inside: |
              $X = $A;
              ...
              $Y += <... $X ...>;
          - pattern-not-inside: |
              $X = $A;
              ...
              $Y -= <... $X ...>;
          - pattern-not-inside: |
              $X = $A;
              ...
              $T2 $Y = <... $X ...>;
          - pattern-not-inside: |
              $X = $A;
              ...
              $T2 *$Y = <... $X ...>;
          - pattern-not-inside: |
              $X = $A;
              ...
              $T2 &$Y = <... $X ...>;
          - pattern-not-inside: |
              $X = $A;
              ...
              $T2 $Y(..., <... $X ...>, ...);
          - pattern-not-inside: |
              $X = $A;
              ...
              return <... $X ...>;
          - pattern-not-inside: |
              $X = $A;
              ...
              if (<... $X ...>) $S;
          - pattern-not-inside: |
              $X = $A;
              ...
              if (<... $X ...>) $S; else $S2;
          - pattern-not-inside: |
              $X = $A;
              ...
              while (<... $X ...>) $S;
          - pattern-not-inside: |
              $X = $A;
              ...
              do $S; while (<... $X ...>);
          - pattern-not-inside: |
              $X = $A;
              ...
              for ($I1; <... $X ...>; $I3) $S;
          - pattern-not-inside: |
              $X = $A;
              ...
              for (<... $X ...>; $I2; $I3) $S;
          - pattern-not-inside: |
              $X = $A;
              ...
              for ($I1; $I2; <... $X ...>) $S;
          - pattern-not-inside: |
              $X = $A;
              ...
              switch (<... $X ...>) $S;
          - pattern-not-inside: |
              $X = $A;
              ...
              <... $X[$IDX] ...>;
          - pattern-not-inside: |
              $X = $A;
              ...
              <... *$X ...>;
          - pattern-not-inside: |
              $X = $A;
              ...
              <... $X->$FF ...>;
          - pattern-not-inside: |
              $X = $A;
              ...
              <... $X.$FF ...>;
          - pattern-not-inside: |
              $X = $A;
              ...
              <... &$X ...>;
          - pattern-not-inside: |
              $X = $A;
              ...
              $X++;
          - pattern-not-inside: |
              $X = $A;
              ...
              ++$X;
          - pattern-not-inside: |
