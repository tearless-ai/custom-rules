rules:
- id: cwe23-relative-path-via-sink-function
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A file is opened with a path built by appending data to a base directory inside a function whose caller reads untrusted input from the console, a file, a socket or the environment and passes the data in, so '../' sequences in that input can escape the directory.
  metadata:
    vulnerability_class: Relative Path Traversal
    help: |
      ## Summary
      A file is opened with a path built by appending data to a base directory inside a function whose caller reads untrusted input from the console, a file, a socket or the environment and passes the data in, so '../' sequences in that input can escape the directory.

      ## Remediation
      Canonicalize the path and verify it stays inside the intended base directory; reject input containing '..' or path separators.
    category: security
    cwe:
    - 'CWE-23: Relative Path Traversal'
    references:
    - https://cwe.mitre.org/data/definitions/23.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Canonicalize the path and verify it stays inside the intended base directory; reject input containing '..' or path separators.
    policy_name: Relative Path Traversal from Untrusted Input (Passed to Helper)
  options:
    constant_propagation: false
    symbolic_propagation: false
  patterns:
  - pattern-either:
    - patterns:
      - pattern: $OPEN($PATH, ...)
      - metavariable-regex:
          metavariable: $OPEN
          regex: ^(FOPEN|fopen|_wfopen|fopen_s|freopen|_wfreopen|OPEN|open|_open|_wopen|open64|creat|openat|CreateFile|CreateFileA|CreateFileW|_sopen|_wsopen|_sopen_s|_wsopen_s)$
    - patterns:
      - pattern-either:
        - pattern-inside: |
            $STREAM_T $STREAM;
            ...
        - pattern-inside: |
            $STREAM_T $STREAM($PATH, ...);
      - metavariable-regex:
          metavariable: $STREAM_T
          regex: ^(std::)?(basic_)?(i|o|w|wi|wo)?fstream$
      - pattern-either:
        - pattern: $STREAM.open($PATH, ...)
        - pattern: $STREAM_T $STREAM($PATH, ...);
  - pattern-not-inside: |
      $PATH_T * $PATH = "...";
      ...
  - pattern-not-inside: |
      $PATH_T * const $PATH = "...";
      ...
  - metavariable-regex:
      metavariable: $PATH
      regex: ^(?!\s*(L|u8|u|U)?\")(?!\s*[A-Z][A-Z0-9_]*\s*$)
  - pattern-inside: |
      $T_SINKFN $SINKFN(...) {
        ...
      }
  - pattern-either:
    - pattern-inside: |
        $T_SINKFN $SINKFN(...) {
          ...
        }
        ...
        $T_CALLER $CALLER(...) {
          ...
          $BUF_T $BUF[$BUF_N] = $BUF_INIT;
          ...
          <... $SRC(...) ...>;
          ...
          <... $SINKFN(...) ...>;
          ...
        }
    - pattern-inside: |
        $T_CALLER $CALLER(...) {
          ...
          $BUF_T $BUF[$BUF_N] = $BUF_INIT;
          ...
          <... $SRC(...) ...>;
          ...
          <... $SINKFN(...) ...>;
          ...
        }
        ...
        $T_SINKFN $SINKFN(...) {
          ...
        }
    - pattern-inside: |
        $T_SINKFN $SINKFN(...) {
          ...
        }
        ...
        $T_CALLER $CALLER(...) {
          ...
          $FPT $FP = $SINKFN;
          ...
          $BUF_T $BUF[$BUF_N] = $BUF_INIT;
          ...
          <... $SRC(...) ...>;
          ...
        }
    - pattern-inside: |
        $T_CALLER $CALLER(...) {
          ...
          $FPT $FP = $SINKFN;
          ...
          $BUF_T $BUF[$BUF_N] = $BUF_INIT;
          ...
          <... $SRC(...) ...>;
          ...
        }
        ...
        $T_SINKFN $SINKFN(...) {
          ...
        }
  - metavariable-regex:
      metavariable: $SRC
      regex: ^(?:std::)?(fgets|fgetws|gets|_getws|getline|getdelim|scanf|wscanf|fscanf|fwscanf|read|_read|recv|recvfrom|recvmsg|WSARecv|WSARecvFrom|getenv|_wgetenv|secure_getenv|GETENV|ReadFile|ReadConsoleA|ReadConsoleW|InternetReadFile)$
  - metavariable-regex:
      metavariable: $BUF_INIT
      regex: ^(?!\s*L?""\s*$)
  - focus-metavariable: $PATH
