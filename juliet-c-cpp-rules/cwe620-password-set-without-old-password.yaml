rules:
- id: cwe620-password-set-without-old-password
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: NetUserSetInfo() level 1003 replaces the password without verifying the old one; use NetUserChangePassword() for user-initiated changes.
  metadata:
    vulnerability_class: Unverified Password Change
    help: |
      ## Summary
      NetUserSetInfo() level 1003 replaces the password without verifying the old one; use NetUserChangePassword() for user-initiated changes.

      ## Remediation
      Require and verify the current password before allowing a password change.
    category: security
    cwe:
    - 'CWE-620: Unverified Password Change'
    references:
    - https://cwe.mitre.org/data/definitions/620.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Require and verify the current password before allowing a password change.
  pattern-either:
  - pattern: NetUserSetInfo($SRV, $USER, 1003, ...)
  - pattern: NetUserSetInfo($SRV, $USER, USER_PASSWORD_INFOLEVEL, ...)
