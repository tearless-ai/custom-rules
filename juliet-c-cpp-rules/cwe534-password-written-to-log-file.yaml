rules:
- id: cwe534-password-written-to-log-file
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: A password or other secret is written to a log or debug file, exposing it to anyone who can read the file.
  metadata:
    vulnerability_class: Information Exposure Through Debug Log Files
    help: |
      ## Summary
      A password or other secret is written to a log or debug file, exposing it to anyone who can read the file.

      ## Remediation
      Do not write sensitive data such as passwords to debug logs.
    category: security
    cwe:
    - 'CWE-534: Information Exposure Through Debug Log Files'
    references:
    - https://cwe.mitre.org/data/definitions/534.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Do not write sensitive data such as passwords to debug logs.
    policy_name: Sensitive Data Written to Debug Log File
  patterns:
  - pattern-either:
    - pattern: $PRINT($FP, $FMT, ..., $P, ...)
  - metavariable-regex:
      metavariable: $PRINT
      regex: ^(fprintf|fwprintf|_ftprintf|vfprintf|syslog)$
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^.*(passw|passwd|pwd|passphrase|secret|privkey|private_key|credential)
  - metavariable-pattern:
      metavariable: $FP
      patterns:
      - pattern-not: stderr
      - pattern-not: stdout
