rules:
- id: cwe570-self-comparison-with-offset
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: A variable is compared for equality with itself plus or minus a non-zero constant, which is always false.
  metadata:
    vulnerability_class: Expression is Always False
    help: |
      ## Summary
      A variable is compared for equality with itself plus or minus a non-zero constant, which is always false.

      ## Remediation
      Fix conditions that are always false; they indicate a logic error or dead code.
    category: correctness
    cwe:
    - 'CWE-570: Expression is Always False'
    references:
    - https://cwe.mitre.org/data/definitions/570.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Fix conditions that are always false; they indicate a logic error or dead code.
    policy_name: 'Expression Always False: Variable Compared With Itself Offset'
  patterns:
  - pattern-either:
    - pattern: $X == $X + $K
    - pattern: $X == ($X + $K)
    - pattern: $X == $X - $K
    - pattern: $X == ($X - $K)
  - metavariable-regex:
      metavariable: $K
      regex: ^[1-9][0-9]*[uUlL]*$
