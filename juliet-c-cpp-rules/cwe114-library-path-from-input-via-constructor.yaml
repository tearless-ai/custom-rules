rules:
- id: cwe114-library-path-from-input-via-constructor
  languages:
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A dynamic library is loaded from a path in a destructor, on member data whose constructor reads untrusted input from the console, a file, a socket or the environment, so that input decides which code the process loads.
  metadata:
    vulnerability_class: Process Control
    help: |
      ## Summary
      A dynamic library is loaded from a path in a destructor, on member data whose constructor reads untrusted input from the console, a file, a socket or the environment, so that input decides which code the process loads.

      ## Remediation
      Load libraries and programs only from fixed absolute paths; never let external input choose the module or command to load.
    category: security
    cwe:
    - 'CWE-114: Process Control'
    references:
    - https://cwe.mitre.org/data/definitions/114.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Load libraries and programs only from fixed absolute paths; never let external input choose the module or command to load.
    policy_name: Library Loaded from Untrusted Path (Constructor to Destructor)
  patterns:
  - pattern: $LOADLIB($LIB, ...)
  - metavariable-regex:
      metavariable: $LOADLIB
      regex: ^(LoadLibrary|LoadLibraryA|LoadLibraryW|LoadLibraryEx|LoadLibraryExA|LoadLibraryExW|dlopen|g_module_open)$
  - metavariable-regex:
      metavariable: $LIB
      regex: ^(?!\s*(L|u8|u|U)?\")(?!\s*[A-Z][A-Z0-9_]*\s*$)
  - pattern-inside: |
      $T_D $DTOR(...) { ... }
  - metavariable-regex:
      metavariable: $DTOR
      regex: ^(?:\w+::)*(\w+)::~\1$
  - pattern-inside: |
      $T_CTOR $CTOR(...) {
        ...
        <... $SRC(...) ...>;
        ...
      }
      ...
  - metavariable-regex:
      metavariable: $CTOR
      regex: ^(?:\w+::)*(\w+)::\1$
  - metavariable-regex:
      metavariable: $SRC
      regex: ^(?:std::)?(fgets|fgetws|gets|_getws|getline|getdelim|scanf|wscanf|fscanf|fwscanf|read|_read|recv|recvfrom|recvmsg|WSARecv|WSARecvFrom|getenv|_wgetenv|secure_getenv|GETENV|ReadFile|ReadConsoleA|ReadConsoleW|InternetReadFile)$
  - focus-metavariable: $LOADLIB
