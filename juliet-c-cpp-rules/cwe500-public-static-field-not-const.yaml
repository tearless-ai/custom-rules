rules:
- id: cwe500-public-static-field-not-const
  languages:
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: This public static data member is not const, so any code can modify this shared class-wide
    state.
  metadata:
    vulnerability_class: Public Static Field Not Marked Final
    help: |
      ## Summary
      This public static data member is not const, so any code can modify this shared class-wide state.

      ## Remediation
      Make public static fields const or private with accessors.
    category: security
    cwe:
    - 'CWE-500: Public Static Field Not Marked Final'
    references:
    - https://cwe.mitre.org/data/definitions/500.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Make public static fields const or private with accessors.
  pattern-regex: (?m)\bpublic\s*:(?:(?!\b(?:private|protected)\s*:)[^{}])*?^[ \t]*\Kstatic[ \t]+(?!const\b|constexpr\b|inline\b|volatile\s+const\b)[A-Za-z_][\w:<>]*(?:[
    \t]*[*&])*[ \t]+[*&]*[A-Za-z_]\w*[ \t]*(?:\[[^\]]*\])?[ \t]*;
