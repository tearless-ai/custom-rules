rules:
- id: cwe562-return-local-array
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: The function returns the address of a local (stack) array, which is invalid as soon as the function returns.
  metadata:
    vulnerability_class: Return of Stack Variable Address
    help: |
      ## Summary
      The function returns the address of a local (stack) array, which is invalid as soon as the function returns.

      ## Remediation
      Never return the address of a local (stack) variable; return a value, a heap allocation or use a caller-supplied buffer.
    category: security
    cwe:
    - 'CWE-562: Return of Stack Variable Address'
    references:
    - https://cwe.mitre.org/data/definitions/562.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Never return the address of a local (stack) variable; return a value, a heap allocation or use a caller-supplied buffer.
    policy_name: 'Return of Stack Address: Local Array'
  patterns:
  - pattern-either:
    - pattern-inside: |
        $R $F(...) { ... $T $A[$N]; ... }
    - pattern-inside: |
        $R $F(...) { ... $T $A[$N] = $I; ... }
    - pattern-inside: |
        $R $F(...) { ... $T $A[] = $I; ... }
  - pattern-not-inside: |
      $R $F(...) { ... static $T $A[$N]; ... }
  - pattern-not-inside: |
      $R $F(...) { ... static $T $A[$N] = $I; ... }
  - pattern-not-inside: |
      $R $F(...) { ... static $T $A[] = $I; ... }
  - pattern-either:
    - pattern: return $A;
    - pattern: return &$A[$K];
    - pattern: return $A + $K;
    - patterns:
      - pattern-either:
        - pattern-inside: |
            $P = &$A[$K];
            ...
        - pattern-inside: |
            $P = $A;
            ...
        - pattern-inside: |
            $P = $A + $K;
            ...
        - pattern-inside: |
            $PT $P = &$A[$K];
            ...
        - pattern-inside: |
            $PT $P = $A;
            ...
      - pattern-not-inside: |
          $P = &$A[$K];
          ...
          $P = $OTHER;
          ...
      - pattern: return $P;
