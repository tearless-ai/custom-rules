rules:
- id: cwe259-hardcoded-password-in-logon
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A logon or credential API is called with a hard-coded password literal.
  metadata:
    vulnerability_class: Use of Hard-coded Password
    help: |
      ## Summary
      A logon or credential API is called with a hard-coded password literal.

      ## Remediation
      Remove hard-coded passwords; load credentials from a protected store or prompt for them at run time.
    category: security
    cwe:
    - 'CWE-259: Use of Hard-coded Password'
    references:
    - https://cwe.mitre.org/data/definitions/259.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Remove hard-coded passwords; load credentials from a protected store or prompt for them at run time.
    policy_name: 'Hard-coded Password: Literal Passed to Logon API'
  patterns:
  - pattern: $F($U, $D, $LIT, ...)
  - metavariable-regex:
      metavariable: $F
      regex: ^(LogonUser|LogonUserA|LogonUserW|LogonUserExA|LogonUserExW|CreateProcessWithLogonW|WNetAddConnection2A|WNetAddConnection2W)$
  - metavariable-regex:
      metavariable: $LIT
      regex: ^L?"[^"]+"$
