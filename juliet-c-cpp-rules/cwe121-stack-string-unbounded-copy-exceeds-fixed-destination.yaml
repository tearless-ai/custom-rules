rules:
- id: cwe121-stack-string-unbounded-copy-exceeds-fixed-destination
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: The stack string '$SRC' is filled to a length that does not fit in the fixed-size array '$DST';
    copying it bounded only by the source length overflows the destination.
  metadata:
    vulnerability_class: Stack-based Buffer Overflow
    help: |
      ## Summary
      The stack string '`$SRC`' is filled to a length that does not fit in the fixed-size array '`$DST`'; copying it bounded only by the source length overflows the destination.

      ## Remediation
      Bound every copy and index by the destination's size (sizeof the array), use size-checked APIs such as snprintf, and validate lengths and indexes from input before use.
    category: security
    cwe:
    - 'CWE-121: Stack-based Buffer Overflow'
    references:
    - https://cwe.mitre.org/data/definitions/121.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Bound every copy and index by the destination's size (sizeof the array), use size-checked
      APIs such as snprintf, and validate lengths and indexes from input before use.
  patterns:
  - pattern-either:
    - pattern: strcpy($DST, $SRC)
    - pattern: wcscpy($DST, $SRC)
    - pattern: strcat($DST, $SRC)
    - pattern: wcscat($DST, $SRC)
    - pattern: strncat($DST, $SRC, strlen($SRC))
    - pattern: wcsncat($DST, $SRC, wcslen($SRC))
  - pattern-either:
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $TD $DST[$N];
          ...
        }
    - pattern-inside: |-
        $RET $F(...) {
          ...
          $TD $DST[$N] = $INIT;
          ...
        }
  - pattern-either:
    - patterns:
      - pattern-either:
        - patterns:
          - pattern-either:
            - pattern-inside: |-
                $RET $F(...) {
                  ...
                  $T4 $B[$K];
                  ...
                }
            - pattern-inside: |-
                $RET $F(...) {
                  ...
                  $T4 $B[$K] = $INIT;
                  ...
                }
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $V = $B;
                ...
              }
        - patterns:
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $B = ($T5 *)$AF2(...);
                ...
              }
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $V = $B;
                ...
              }
          - metavariable-regex:
              metavariable: $AF2
              regex: ^(alloca|_alloca|ALLOCA)$
        - patterns:
          - pattern-inside: |-
              $RET $F(...) {
                ...
                $V = ($T5 *)$AF2(...);
                ...
              }
          - metavariable-regex:
              metavariable: $AF2
              regex: ^(alloca|_alloca|ALLOCA)$
      - patterns:
        - pattern-inside: |-
            $RET $F(...) {
              ...
              $MS($V1, $C, $L);
              ...
            }
        - metavariable-regex:
            metavariable: $MS
            regex: ^w?memset$
      - metavariable-comparison:
          comparison: str($V1) == str($V)
