    - patterns:
      - pattern: swprintf($D, $N, $FMT, (int $A))
      - metavariable-regex:
          metavariable: $FMT
          regex: '^L?"(?:[^%"\\]|\\.|%%)*%[-+ #0]*[0-9]*(?:\.[0-9]+)?(?:s)(?:[^%"\\]|\\.|%%)*"$'
    - patterns:
