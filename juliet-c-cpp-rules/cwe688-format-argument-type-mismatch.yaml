rules:
- id: cwe688-format-argument-type-mismatch
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: The argument $A has type an incompatible type, which does not match the conversion specifier
    in the format string; this is undefined behavior.
  metadata:
    vulnerability_class: Function Call With Incorrect Variable or Reference as Argument
    help: |
      ## Summary
      The argument `$A` has type an incompatible type, which does not match the conversion specifier in the format string; this is undefined behavior.

      ## Remediation
      Pass the intended variable to each argument, matching the types the format string or API expects.
    category: correctness
    cwe:
    - 'CWE-688: Function Call With Incorrect Variable or Reference as Argument'
    references:
    - https://cwe.mitre.org/data/definitions/688.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Pass the intended variable to each argument, matching the types the format string or
      API expects.
  patterns:
  - pattern-either:
    - patterns:
      - pattern: printf($FMT, (int $A))
      - metavariable-regex:
          metavariable: $FMT
          regex: '^L?"(?:[^%"\\]|\\.|%%)*%[-+ #0]*[0-9]*(?:\.[0-9]+)?(?:s)(?:[^%"\\]|\\.|%%)*"$'
    - patterns:
      - pattern: wprintf($FMT, (int $A))
      - metavariable-regex:
          metavariable: $FMT
          regex: '^L?"(?:[^%"\\]|\\.|%%)*%[-+ #0]*[0-9]*(?:\.[0-9]+)?(?:s)(?:[^%"\\]|\\.|%%)*"$'
    - patterns:
