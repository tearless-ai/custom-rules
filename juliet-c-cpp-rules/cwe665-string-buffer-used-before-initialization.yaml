rules:
- id: cwe665-string-buffer-used-before-initialization
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A pointer is set to an uninitialized character buffer, and the buffer is later used as a string (for example as the destination of strcat()) without ever being initialized or null-terminated.
  metadata:
    vulnerability_class: Improper Initialization
    help: |
      ## Summary
      A pointer is set to an uninitialized character buffer, and the buffer is later used as a string (for example as the destination of strcat()) without ever being initialized or null-terminated.

      ## Remediation
      Initialize objects and buffers fully (including string terminators) before use.
    category: security
    cwe:
    - 'CWE-665: Improper Initialization'
    references:
    - https://cwe.mitre.org/data/definitions/665.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Initialize objects and buffers fully (including string terminators) before use.
  patterns:
  - pattern-inside: |
      $R $F(...) { ... $BT $BUF[$N]; ... }
  - pattern: $X = $BUF;
  - pattern-either:
    - pattern-inside: |
        $R $F(...) { ... $CAT($X, ...); ... }
    - pattern-inside: |
        $R $F(...) { ... $RET = $CAT($X, ...); ... }
    - pattern-inside: |
        $R $F(...) { ... $T1 $C = $X; ... $CAT($C, ...); ... }
    - pattern-inside: |
        $R $F(...) { ... $T1 $C = $X; ... $T2 $Y = $C; ... $CAT($Y, ...); ... }
    - pattern-inside: |
        $R $F(...) { ... $T1 &$REF = $X; ... $T2 $Y = $REF; ... $CAT($Y, ...); ... }
    - pattern-inside: |
        $RC $CALLEE(..., $PT $P, ...) { ... $CAT($P, ...); ... }
        ...
        $R $F(...) { ... $CALLEE(..., $X, ...); ... }
    - pattern-inside: |
        $RC $CALLEE(..., $PT $P, ...) { ... $CAT($P, ...); ... }
        ...
        $R $F(...) { ... $FT (*$FP)(...) = $CALLEE; ... $FP(..., $X, ...); ... }
    - pattern-inside: |
        $RC $READER(...) { ... $T2 $Y = $G; ... $CAT($Y, ...); ... }
        ...
        $R $F(...) { ... $G = $X; ... }
  - metavariable-regex:
      metavariable: $CAT
      regex: ^(strcat|strncat|wcscat|wcsncat|_mbscat|_mbsncat|lstrcat|lstrcatA|lstrcatW|StrCat|strlen|wcslen)$
  - pattern-not-inside: |
      $R $F(...) { ... $X[$I] = $V; ... }
  - pattern-not-inside: |
      $R $F(...) { ... *$X = $V; ... }
  - pattern-not-inside: |
      $R $F(...) { ... strcpy($X, ...); ... }
  - pattern-not-inside: |
      $R $F(...) { ... wcscpy($X, ...); ... }
  - pattern-not-inside: |
      $R $F(...) { ... strncpy($X, ...); ... }
  - pattern-not-inside: |
      $R $F(...) { ... wcsncpy($X, ...); ... }
  - pattern-not-inside: |
      $R $F(...) { ... memset($X, ...); ... }
  - pattern-not-inside: |
      $R $F(...) { ... wmemset($X, ...); ... }
  - pattern-not-inside: |
      $R $F(...) { ... memcpy($X, ...); ... }
  - pattern-not-inside: |
      $R $F(...) { ... memmove($X, ...); ... }
  - pattern-not-inside: |
      $R $F(...) { ... wmemcpy($X, ...); ... }
  - pattern-not-inside: |
      $R $F(...) { ... sprintf($X, ...); ... }
  - pattern-not-inside: |
