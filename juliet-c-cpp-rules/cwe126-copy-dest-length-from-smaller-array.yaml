rules:
- id: cwe126-copy-dest-length-from-smaller-array
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: Data is copied out of a buffer using the length of a larger destination buffer, which reads
    past the end of the smaller source buffer.
  metadata:
    vulnerability_class: Buffer Over-read
    help: |
      ## Summary
      Data is copied out of a buffer using the length of a larger destination buffer, which reads past the end of the smaller source buffer.

      ## Remediation
      Bound reads by the source buffer's real size, ensure strings are NUL-terminated after strncpy/memcpy, and validate indexes against the buffer length.
    category: security
    cwe:
    - 'CWE-126: Buffer Over-read'
    references:
    - https://cwe.mitre.org/data/definitions/126.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Bound reads by the source buffer's real size, ensure strings are NUL-terminated after
      strncpy/memcpy, and validate indexes against the buffer length.
  mode: taint
  options:
    taint_unify_mvars: true
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $ST $SMALL[$N];
          ...
      - pattern-inside: |
          $ST * $SMALL = ($CT) ALLOCA($N * $SZ);
          ...
      - pattern-inside: |
          $ST * $SMALL = ($CT) alloca($N * $SZ);
          ...
    - pattern: $SMALL
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $RT $F(...) { ... $ST $SMALL[$N]; ... }
      - pattern-inside: |
          $RT $F(...) { ... $ST * $SMALL = ($CT) ALLOCA($N * $SZ); ... }
      - pattern-inside: |
          $RT $F(...) { ... $ST * $SMALL = ($CT) alloca($N * $SZ); ... }
    - pattern-inside: |
        $RT $F(...) { ... $P = $SMALL; ... }
    - pattern-either:
      - pattern: $P
      - patterns:
        - pattern-inside: |
            $RT $F(...) { ... *$Q1 = $P; ... }
        - pattern-inside: |
            $RT $F(...) { ... $T1 $Q1 = &$V; ... }
        - pattern-inside: |
            $RT $F(...) { ... $T2 $Q2 = &$V; ... }
        - pattern: '*$Q2'
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $ST $SMALL[$N];
          ...
      - pattern-inside: |
          $ST * $SMALL = ($CT) ALLOCA($N * $SZ);
          ...
      - pattern-inside: |
          $ST * $SMALL = ($CT) alloca($N * $SZ);
          ...
    - pattern-inside: |
        $DT $DEST[$M];
        ...
    - pattern-either:
      - pattern: memcpy($DEST, $SRC, <... $DEST ...>)
      - pattern: memmove($DEST, $SRC, <... $DEST ...>)
      - pattern: wmemcpy($DEST, $SRC, <... $DEST ...>)
      - pattern: wmemmove($DEST, $SRC, <... $DEST ...>)
      - pattern: strncpy($DEST, $SRC, <... $DEST ...>)
      - pattern: wcsncpy($DEST, $SRC, <... $DEST ...>)
      - pattern: $DEST[$I] = $SRC[$I]
    - metavariable-comparison:
        comparison: $N < $M
    - focus-metavariable: $SRC
  pattern-propagators:
  - pattern: $U.$FLD = $X
    from: $X
    to: $U
