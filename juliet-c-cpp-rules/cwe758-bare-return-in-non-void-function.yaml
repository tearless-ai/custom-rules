rules:
- id: cwe758-bare-return-in-non-void-function
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A bare 'return;' is used in a function declared to return a value, so callers that use the result get an undefined value.
  metadata:
    vulnerability_class: Reliance on Undefined, Unspecified, or Implementation-Defined Behavior
    help: |
      ## Summary
      A bare 'return;' is used in a function declared to return a value, so callers that use the result get an undefined value.

      ## Remediation
      Avoid undefined behavior: do not read uninitialized memory, and always return a value from non-void functions.
    category: correctness
    cwe:
    - 'CWE-758: Reliance on Undefined, Unspecified, or Implementation-Defined Behavior'
    references:
    - https://cwe.mitre.org/data/definitions/758.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: 'Avoid undefined behavior: do not read uninitialized memory, and always return a value from non-void functions.'
    policy_name: 'Undefined Behavior: Bare Return in Non-Void Function'
  patterns:
  - pattern-inside: |
      $T $F(...) { ... }
  - metavariable-regex:
      metavariable: $T
      regex: ^(?!void$).+
  - pattern: return;
