rules:
- id: cwe401-member-heap-memory-not-released-in-destructor
  languages:
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A data member is assigned heap memory, but the destructor never releases it.
  metadata:
    vulnerability_class: Missing Release of Memory after Effective Lifetime
    help: |
      ## Summary
      A data member is assigned heap memory, but the destructor never releases it.

      ## Remediation
      Free every allocation on every path once it is no longer needed, or use RAII (smart pointers, containers) in C++.
    category: security
    cwe:
    - 'CWE-401: Missing Release of Memory after Effective Lifetime'
    references:
    - https://cwe.mitre.org/data/definitions/401.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Free every allocation on every path once it is no longer needed, or use RAII (smart pointers, containers) in C++.
  options:
    constant_propagation: false
  patterns:
  - pattern-either:
    - patterns:
      - pattern-inside: |
          $R1 $F1(...) { ... $M = $ALLOC; ... }
          ...
          $R2 $F2() { ... }
      - metavariable-regex:
          metavariable: $F2
          regex: .*~
      - pattern-inside: |
          $R1 $F1(...) { ... }
      - pattern: $M = $ALLOC;
      - metavariable-pattern:
          metavariable: $ALLOC
          pattern-either:
          - patterns:
            - pattern-either:
              - pattern: $AF(...)
              - pattern: ($ACT) $AF(...)
            - metavariable-regex:
                metavariable: $AF
                regex: ^(malloc|calloc|realloc|strdup|wcsdup|_strdup|_wcsdup|strndup|wcsndup)$
          - patterns:
            - pattern-either:
              - pattern: new $ANT
              - pattern: new $ANT(...)
            - pattern-not: new ($PB) $PBT
      - pattern-not-inside: |
          $R1 $F1(...) { ... } ... $R2 $F2() { ... free(...); ... }
      - pattern-not-inside: |
          $R1 $F1(...) { ... } ... $R2 $F2() { ... delete $ANY; ... }
      - pattern-not-inside: |
          $R1 $F1(...) { ... } ... $R2 $F2() { ... delete [] $ANY; ... }
      - pattern-not-inside: |
          $R1 $F1(...) { ... } ... $R2 $F2() { ... return $M; ... }
      - pattern-not-inside: |
          $R1 $F1(...) { ... } ... $R2 $F2() { ... $O->$FLD = $M; ... }
      - pattern-not-inside: |
          $R1 $F1(...) { ... } ... $R2 $F2() { ... $ARR[$I] = $M; ... }
      - pattern-not-inside:
          patterns:
          - pattern-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... $U.$UF = $M; ... }
          - pattern-not-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... $UT $U; ... }
      - pattern-not-inside:
          patterns:
          - pattern-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... $U.$UF = $M; ... }
          - pattern-either:
            - pattern-inside: |
                $R1 $F1(...) { ... } ... $R2 $F2() { ... $UCALL(..., $U, ...); ... }
            - pattern-inside: |
                $R1 $F1(...) { ... } ... $R2 $F2() { ... $UCALL(..., &$U, ...); ... }
            - pattern-inside: |
                $R1 $F1(...) { ... } ... $R2 $F2() { ... return $U; ... }
      - pattern-not-inside:
          patterns:
          - pattern-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... *$P = $M; ... }
          - pattern-not-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... $PT $P = &$PV; ... }
      - pattern-not-inside:
          patterns:
          - pattern-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... $Y = $M; ... }
          - metavariable-regex:
              metavariable: $Y
              regex: ^\w+$
          - metavariable-comparison:
              comparison: str($Y) != str($M)
          - pattern-not-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... $YT $Y = $M; ... }
      - pattern-not-inside:
          patterns:
          - pattern-either:
            - pattern-inside: |
                $R1 $F1(...) { ... } ... $R2 $F2() { ... $CALLEE(..., $M, ...); ... }
            - pattern-inside: |
                $R1 $F1(...) { ... } ... $R2 $F2() { ... $CALLEE(..., &$M, ...); ... }
          - metavariable-regex:
              metavariable: $CALLEE
              regex: ^(?!(str|wcs|mem|print|puts|fputs|putws|fputws|fwrite|fread|fgets|fgetws|realloc|scanf|sscanf|fscanf|swscanf|atoi|atol|atof|isalnum|isdigit|isspace|toupper|tolower)\w*$)
    - patterns:
      - pattern-inside: |
          $R1 $F1(...) { ... this->$M = $ALLOC; ... }
          ...
          $R2 $F2() { ... }
      - metavariable-regex:
          metavariable: $F2
          regex: .*~
      - pattern-inside: |
          $R1 $F1(...) { ... }
      - pattern: this->$M = $ALLOC;
      - metavariable-pattern:
          metavariable: $ALLOC
          pattern-either:
          - patterns:
            - pattern-either:
              - pattern: $AF(...)
              - pattern: ($ACT) $AF(...)
            - metavariable-regex:
                metavariable: $AF
                regex: ^(malloc|calloc|realloc|strdup|wcsdup|_strdup|_wcsdup|strndup|wcsndup)$
          - patterns:
            - pattern-either:
              - pattern: new $ANT
              - pattern: new $ANT(...)
            - pattern-not: new ($PB) $PBT
      - pattern-not-inside: |
          $R1 $F1(...) { ... } ... $R2 $F2() { ... free(...); ... }
      - pattern-not-inside: |
          $R1 $F1(...) { ... } ... $R2 $F2() { ... delete $ANY; ... }
      - pattern-not-inside: |
          $R1 $F1(...) { ... } ... $R2 $F2() { ... delete [] $ANY; ... }
      - pattern-not-inside: |
          $R1 $F1(...) { ... } ... $R2 $F2() { ... return $M; ... }
      - pattern-not-inside: |
          $R1 $F1(...) { ... } ... $R2 $F2() { ... $O->$FLD = $M; ... }
      - pattern-not-inside: |
          $R1 $F1(...) { ... } ... $R2 $F2() { ... $ARR[$I] = $M; ... }
      - pattern-not-inside:
          patterns:
          - pattern-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... $U.$UF = $M; ... }
          - pattern-not-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... $UT $U; ... }
      - pattern-not-inside:
          patterns:
          - pattern-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... $U.$UF = $M; ... }
          - pattern-either:
            - pattern-inside: |
                $R1 $F1(...) { ... } ... $R2 $F2() { ... $UCALL(..., $U, ...); ... }
            - pattern-inside: |
                $R1 $F1(...) { ... } ... $R2 $F2() { ... $UCALL(..., &$U, ...); ... }
            - pattern-inside: |
                $R1 $F1(...) { ... } ... $R2 $F2() { ... return $U; ... }
      - pattern-not-inside:
          patterns:
          - pattern-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... *$P = $M; ... }
          - pattern-not-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... $PT $P = &$PV; ... }
      - pattern-not-inside:
          patterns:
          - pattern-inside: |
              $R1 $F1(...) { ... } ... $R2 $F2() { ... $Y = $M; ... }
          - metavariable-regex:
              metavariable: $Y
              regex: ^\w+$
          - metavariable-comparison:
              comparison: str($Y) != str($M)
          - pattern-not-inside: |
