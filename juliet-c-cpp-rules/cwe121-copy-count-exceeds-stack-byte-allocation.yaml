rules:
- id: cwe121-copy-count-exceeds-stack-byte-allocation
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A stack buffer is allocated with a byte count that was not multiplied by the element size, so copying whole elements into it overflows the allocation.
  metadata:
    vulnerability_class: Stack-based Buffer Overflow
    help: |
      ## Summary
      A stack buffer is allocated with a byte count that was not multiplied by the element size, so copying whole elements into it overflows the allocation.

      ## Remediation
      Bound every copy and index by the destination's size (sizeof the array), use size-checked APIs such as snprintf, and validate lengths and indexes from input before use.
    category: security
    cwe:
    - 'CWE-121: Stack-based Buffer Overflow'
    references:
    - https://cwe.mitre.org/data/definitions/121.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Bound every copy and index by the destination's size (sizeof the array), use size-checked APIs such as snprintf, and validate lengths and indexes from input before use.
    policy_name: 'Stack Buffer Overflow: Allocation Missing Element Size'
  patterns:
  - pattern-either:
    - pattern-either:
      - pattern: memcpy($DST, $SRC, $M * sizeof(...))
      - pattern: memmove($DST, $SRC, $M * sizeof(...))
      - pattern: wmemcpy($DST, $SRC, $M)
      - pattern: wmemmove($DST, $SRC, $M)
    - patterns:
      - pattern-inside: for ($I = $Z; $I < $M; $I++) { ... }
      - pattern: $DST[$I] = $E;
    - pattern-either:
      - pattern: strncpy($DST, $SRC, $M)
      - pattern: wcsncpy($DST, $SRC, $M)
      - pattern: strncat($DST, $SRC, $M)
      - pattern: wcsncat($DST, $SRC, $M)
    - pattern-either:
      - pattern: snprintf($DST, $M, ...)
      - pattern: _snprintf($DST, $M, ...)
      - pattern: _snwprintf($DST, $M, ...)
      - pattern: swprintf($DST, $M, ...)
      - pattern: vsnprintf($DST, $M, ...)
      - pattern: SNPRINTF($DST, $M, ...)
  - pattern-either:
    - patterns:
      - pattern-inside: |-
          $RET $F(...) {
            ...
            $V = ($T2 *)$AF($N);
            ...
          }
      - metavariable-regex:
          metavariable: $AF
          regex: ^(alloca|_alloca|ALLOCA)$
      - metavariable-regex:
          metavariable: $T2
          regex: ^(?!(char|signed char|unsigned char|void|wchar_t|uint8_t|int8_t)$).*$
    - patterns:
      - patterns:
        - pattern-inside: |-
            $CR1 $SINK($PT $V) {
              ...
            }
            ...
            $CR2 $CALLER(...) {
              ...
              $A = ($T2 *)$AF($N);
              ...
              $SINK($A);
              ...
            }
        - metavariable-regex:
            metavariable: $AF
            regex: ^(alloca|_alloca|ALLOCA)$
        - metavariable-regex:
            metavariable: $T2
            regex: ^(?!(char|signed char|unsigned char|void|wchar_t|uint8_t|int8_t)$).*$
      - pattern-inside: |-
          $CR1 $SINK($PT $V) {
            ...
          }
    - patterns:
      - patterns:
        - pattern-inside: |-
            $CR1 $SINK($PT $V) {
              ...
            }
            ...
            $CR2 $CALLER(...) {
              ...
              $FT (*$FPTR)(...) = $SINK;
              ...
              $A = ($T2 *)$AF($N);
              ...
              $FPTR($A);
              ...
            }
        - metavariable-regex:
            metavariable: $AF
            regex: ^(alloca|_alloca|ALLOCA)$
        - metavariable-regex:
            metavariable: $T2
            regex: ^(?!(char|signed char|unsigned char|void|wchar_t|uint8_t|int8_t)$).*$
      - pattern-inside: |-
          $CR1 $SINK($PT $V) {
            ...
          }
    - patterns:
      - patterns:
        - pattern-inside: |-
            $CR1 $SINK() {
              ...
              $PT $V = $GV;
              ...
            }
            ...
            $CR2 $CALLER(...) {
              ...
              $A = ($T2 *)$AF($N);
              ...
              $GV = $A;
              ...
              $SINK();
              ...
            }
        - metavariable-regex:
            metavariable: $AF
            regex: ^(alloca|_alloca|ALLOCA)$
        - metavariable-regex:
            metavariable: $T2
            regex: ^(?!(char|signed char|unsigned char|void|wchar_t|uint8_t|int8_t)$).*$
      - pattern-inside: |-
          $CR1 $SINK() {
            ...
          }
    - patterns:
      - patterns:
        - pattern-inside: |-
            $CR1 $SRCF(...) {
              ...
              $X = ($T2 *)$AF($N);
              ...
              return $X;
              ...
            }
            ...
            $CR2 $USEF(...) {
              ...
              $V = $SRCF(...);
              ...
            }
        - metavariable-regex:
            metavariable: $AF
            regex: ^(alloca|_alloca|ALLOCA)$
        - metavariable-regex:
            metavariable: $T2
            regex: ^(?!(char|signed char|unsigned char|void|wchar_t|uint8_t|int8_t)$).*$
      - pattern-inside: |-
          $CR2 $USEF(...) {
            ...
          }
    - patterns:
      - patterns:
        - pattern-inside: |-
            $CR1 $SRCF($PT &$X) {
              ...
              $X = ($T2 *)$AF($N);
              ...
            }
            ...
            $CR2 $USEF(...) {
              ...
              $SRCF($V);
              ...
            }
        - metavariable-regex:
            metavariable: $AF
            regex: ^(alloca|_alloca|ALLOCA)$
        - metavariable-regex:
            metavariable: $T2
            regex: ^(?!(char|signed char|unsigned char|void|wchar_t|uint8_t|int8_t)$).*$
      - pattern-inside: |-
          $CR2 $USEF(...) {
            ...
          }
    - patterns:
      - patterns:
        - pattern-inside: |-
            $CR1 $SETF(...) {
              ...
              $V = ($T2 *)$AF($N);
              ...
            }
            ...
            $CR2 $USEF(...) {
              ...
            }
        - metavariable-regex:
            metavariable: $AF
            regex: ^(alloca|_alloca|ALLOCA)$
        - metavariable-regex:
            metavariable: $T2
            regex: ^(?!(char|signed char|unsigned char|void|wchar_t|uint8_t|int8_t)$).*$
      - pattern-inside: |-
          $CR2 $USEF(...) {
            ...
          }
      - pattern-not-inside: |-
          $CX $USEF(...) {
            ...
            $TT $V;
            ...
          }
      - pattern-not-inside: |-
          $CX $SETF(...) {
            ...
            $TT $V;
            ...
          }
          ...
          $CY $USEF(...) {
            ...
          }
      - pattern-not-inside: |-
          $CX $USEF(...) {
            ...
            $TT $V = $IV;
            ...
          }
      - pattern-not-inside: |-
          $CX $SETF(...) {
            ...
            $TT $V = $IV;
            ...
          }
          ...
          $CY $USEF(...) {
            ...
          }
      - pattern-not-inside: |-
          $CX $USEF(..., $TT $V, ...) {
            ...
          }
      - pattern-not-inside: |-
          $CX $SETF(..., $TT $V, ...) {
            ...
          }
          ...
          $CY $USEF(...) {
            ...
          }
  - metavariable-comparison:
      comparison: str($V) == str($DST) and $M * 2 > $N
