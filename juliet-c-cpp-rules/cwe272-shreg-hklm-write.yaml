rules:
- id: cwe272-shreg-hklm-write
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: $F() targets the HKEY_LOCAL_MACHINE hive, which requires administrative rights; prefer the per-user HKEY_CURRENT_USER hive.
  metadata:
    vulnerability_class: Least Privilege Violation
    help: |
      ## Summary
      `$F()` targets the HKEY_LOCAL_MACHINE hive, which requires administrative rights; prefer the per-user HKEY_CURRENT_USER hive.

      ## Remediation
      Request the least privilege needed: write per-user registry keys instead of HKLM, and quote executable paths passed to process-creation APIs.
    category: security
    cwe:
    - 'CWE-272: Least Privilege Violation'
    references:
    - https://cwe.mitre.org/data/definitions/272.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: 'Request the least privilege needed: write per-user registry keys instead of HKLM, and quote executable paths passed to process-creation APIs.'
  patterns:
  - pattern-either:
    - patterns:
      - pattern: $F($KEY, $ACCESS, $REL, $OUT, $FLAGS)
      - metavariable-regex:
          metavariable: $F
          regex: ^(SHRegCreateUSKey|SHRegCreateUSKeyA|SHRegCreateUSKeyW)$
      - metavariable-pattern:
          metavariable: $FLAGS
          pattern-either:
          - pattern: <... SHREGSET_HKLM ...>
          - pattern: <... SHREGSET_FORCE_HKLM ...>
    - patterns:
      - pattern: $F($KEY, $ACCESS, $REL, $OUT, TRUE)
      - metavariable-regex:
          metavariable: $F
          regex: ^(SHRegOpenUSKey|SHRegOpenUSKeyA|SHRegOpenUSKeyW)$
      - metavariable-pattern:
          metavariable: $ACCESS
          pattern-either:
          - pattern: <... KEY_WRITE ...>
          - pattern: <... KEY_ALL_ACCESS ...>
          - pattern: <... KEY_SET_VALUE ...>
  - focus-metavariable: $F
