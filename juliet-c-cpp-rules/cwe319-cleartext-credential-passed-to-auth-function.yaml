rules:
- id: cwe319-cleartext-credential-passed-to-auth-function
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A credential is received from the network and passed to a helper that uses it for authentication without decrypting it, so it travels in cleartext.
  metadata:
    vulnerability_class: Cleartext Transmission of Sensitive Information
    help: |
      ## Summary
      A credential is received from the network and passed to a helper that uses it for authentication without decrypting it, so it travels in cleartext.

      ## Remediation
      Encrypt sensitive data in transit with TLS instead of sending it over plain sockets.
    category: security
    cwe:
    - 'CWE-319: Cleartext Transmission of Sensitive Information'
    references:
    - https://cwe.mitre.org/data/definitions/319.html
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Encrypt sensitive data in transit with TLS instead of sending it over plain sockets.
    policy_name: Cleartext Credential over Network (Passed to Helper)
  patterns:
  - pattern: $RECV($SOCK, $BUF, ...)
  - metavariable-regex:
      metavariable: $RECV
      regex: ^(recv|recvfrom|recvmsg|WSARecv|WSARecvFrom|read)$
  - pattern-inside: |
      $T_C $CALLER(...) { ... }
  - pattern-either:
    - pattern-inside: |
        $T_S $SINKFN(...) {
          ...
          <... $LOGON(...) ...>;
          ...
        }
        ...
        $T_C $CALLER(...) {
          ...
          <... $RECV(...) ...>;
          ...
          <... $SINKFN(...) ...>;
          ...
        }
    - pattern-inside: |
        $T_C $CALLER(...) {
          ...
          <... $RECV(...) ...>;
          ...
          <... $SINKFN(...) ...>;
          ...
        }
        ...
        $T_S $SINKFN(...) {
          ...
          <... $LOGON(...) ...>;
          ...
        }
    - pattern-inside: |
        $T_S $SINKFN(...) {
          ...
          <... $LOGON(...) ...>;
          ...
        }
        ...
        $T_C $CALLER(...) {
          ...
          $FPT $FP = $SINKFN;
          ...
          <... $RECV(...) ...>;
          ...
        }
  - metavariable-regex:
      metavariable: $LOGON
      regex: ^(LogonUser|LogonUserA|LogonUserW|LogonUserExA|LogonUserExW|pam_authenticate|crypt|crypt_r)$
  - pattern-not-inside: |
      $T_S $SINKFN(...) {
        ...
        <... CryptDecrypt(...) ...>;
        ...
      }
      ...
  - pattern-not-inside: |
      $T_S $SINKFN(...) {
        ...
        <... BCryptDecrypt(...) ...>;
        ...
      }
      ...
  - pattern-not-inside: |
      $T_S $SINKFN(...) {
        ...
        <... CryptUnprotectData(...) ...>;
        ...
      }
      ...
  - pattern-not-inside: |
      $T_S $SINKFN(...) {
        ...
        <... EVP_DecryptUpdate(...) ...>;
        ...
      }
      ...
  - pattern-not-inside: |
      $T_S $SINKFN(...) {
        ...
        <... EVP_OpenUpdate(...) ...>;
        ...
      }
      ...
  - focus-metavariable: $RECV
