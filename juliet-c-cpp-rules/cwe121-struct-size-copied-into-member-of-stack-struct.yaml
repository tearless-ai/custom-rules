rules:
- id: cwe121-struct-size-copied-into-member-of-stack-struct
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: The copy length is the size of the whole structure but the destination is only its member '$FLD'; the copy overruns the member.
  metadata:
    vulnerability_class: Stack-based Buffer Overflow
    help: |
      ## Summary
      The copy length is the size of the whole structure but the destination is only its member '`$FLD`'; the copy overruns the member.

      ## Remediation
      Bound every copy and index by the destination's size (sizeof the array), use size-checked APIs such as snprintf, and validate lengths and indexes from input before use.
    category: security
    cwe:
    - 'CWE-121: Stack-based Buffer Overflow'
    references:
    - https://cwe.mitre.org/data/definitions/121.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Bound every copy and index by the destination's size (sizeof the array), use size-checked APIs such as snprintf, and validate lengths and indexes from input before use.
  patterns:
  - pattern-either:
    - pattern: memcpy($S.$FLD, $X, sizeof($S))
    - pattern: memmove($S.$FLD, $X, sizeof($S))
  - pattern-inside: |-
      $RET $F(...) {
        ...
        $TY $S;
        ...
      }
