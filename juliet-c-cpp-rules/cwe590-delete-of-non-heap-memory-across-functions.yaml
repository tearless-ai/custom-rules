rules:
- id: cwe590-delete-of-non-heap-memory-across-functions
  languages:
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: ERROR
  message: A pointer to stack, static or alloca() memory is released with delete/delete[]; only memory obtained from the matching heap allocator may be released. The non-heap memory is created in a different function of the same file.
  metadata:
    vulnerability_class: Free of Memory not on the Heap
    help: |
      ## Summary
      A pointer to stack, static or alloca() memory is released with delete/delete[]; only memory obtained from the matching heap allocator may be released. The non-heap memory is created in a different function of the same file.

      ## Remediation
      Only free memory that was allocated on the heap; never free stack arrays, static data or string literals.
    category: security
    cwe:
    - 'CWE-590: Free of Memory not on the Heap'
    references:
    - https://cwe.mitre.org/data/definitions/590.html
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Only free memory that was allocated on the heap; never free stack arrays, static data or string literals.
  pattern-either:
  - patterns:
    - pattern-inside: |
        $R1 $F(..., $PT $D, ...) { ... }
        ...
        $R2 $G(...) {
          ...
          $TB $B[$N];
          ...
          $X = $B;
          ...
          $F(..., $X, ...);
          ...
        }
    - pattern-inside: |
        $R1 $F(..., $PT $D, ...) { ... }
    - pattern-either:
      - pattern: delete $D;
      - pattern: delete [] $D;
  - patterns:
    - pattern-inside: |
        $R1 $F(..., $PT $D, ...) { ... }
        ...
        $R2 $G(...) {
          ...
          $TB $B;
          ...
          $X = &$B;
          ...
          $F(..., $X, ...);
          ...
        }
    - pattern-inside: |
        $R1 $F(..., $PT $D, ...) { ... }
    - pattern-either:
      - pattern: delete $D;
      - pattern: delete [] $D;
    - metavariable-regex:
        metavariable: $TB
        regex: ^[^*&]*$
  - patterns:
    - pattern-inside: |
        $R1 $F(..., $PT $D, ...) { ... }
        ...
        $R2 $G(...) {
          ...
          $TD $B = $SRC;
          ...
          $X = $B;
          ...
          $F(..., $X, ...);
          ...
        }
    - pattern-inside: |
        $R1 $F(..., $PT $D, ...) { ... }
    - pattern-either:
      - pattern: delete $D;
      - pattern: delete [] $D;
    - metavariable-pattern:
        metavariable: $SRC
        pattern-either:
        - patterns:
          - pattern-either:
            - pattern: $AF(...)
            - pattern: ($ACT) $AF(...)
          - metavariable-regex:
              metavariable: $AF
              regex: ^(alloca|_alloca|ALLOCA|__builtin_alloca)$
        - pattern: new ($BUF) $PNT
