rules:
- id: cwe526-environment-variable-disclosed
  languages:
  - c
  - cpp
  paths:
    include:
    - '*.c'
    - '*.h'
    - '*.cpp'
    - '*.cc'
    - '*.cxx'
    - '*.c++'
    - '*.hpp'
    - '*.hh'
    - '*.hxx'
    - '*.inc'
  severity: WARNING
  message: The value of an environment variable is written straight to output by $OUT(), which can disclose system configuration.
  metadata:
    vulnerability_class: Exposure of Sensitive Information Through Environmental Variables
    help: |
      ## Summary
      The value of an environment variable is written straight to output by `$OUT()`, which can disclose system configuration.

      ## Remediation
      Do not expose environment variables in output or logs; they can contain secrets and configuration details.
    category: security
    cwe:
    - 'CWE-526: Exposure of Sensitive Information Through Environmental Variables'
    references:
    - https://cwe.mitre.org/data/definitions/526.html
    confidence: LOW
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    source: Validated against NIST Juliet C/C++ Test Suite v1.3
    remediation: Do not expose environment variables in output or logs; they can contain secrets and configuration details.
  patterns:
  - pattern-either:
    - pattern: $OUT(..., getenv($V), ...)
    - pattern: $OUT(..., _wgetenv($V), ...)
    - pattern: $OUT(..., secure_getenv($V), ...)
  - metavariable-regex:
      metavariable: $OUT
      regex: (?i)^.*(print|puts|write|log|send|out).*$
